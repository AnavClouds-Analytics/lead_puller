<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Lead Puller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --panel:#FFFFFF; --ink:#15171C; --ink2:#4A505C; --ink3:#6B7280; --line:#E2E5EA; --line2:#EEF0F3;
  --brand:#1F4FD8; --brand-ink:#FFFFFF; --brand-soft:#EAF0FF; --out:#9A4307; --out-soft:#FDF0E6;
  --ok:#14713D; --ok-soft:#E3F4EA; --warn:#8A5A00; --warn-soft:#FFF4DB; --bad:#B42318; --bad-soft:#FDECEC;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1115; --panel:#171A20; --ink:#E9ECF1; --ink2:#B4BAC6; --ink3:#8D94A3; --line:#2A2F38; --line2:#20242B;
  --brand:#6B93FF; --brand-ink:#0B0D12; --brand-soft:#1B2540; --out:#F3A86B; --out-soft:#2E2014;
  --ok:#4CC584; --ok-soft:#14291E; --warn:#F0B44A; --warn-soft:#2C2213; --bad:#FF7A7A; --bad-soft:#2D1717;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.app{display:flex;min-height:100vh}
aside.sidebar{width:220px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.logo{font-weight:700;font-size:16px;letter-spacing:-.01em;padding:4px 10px 16px}
nav.main{display:flex;flex-direction:column;gap:2px}
nav.main a{padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:500}
nav.main a:hover{background:var(--line2);text-decoration:none}
nav.main a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.bal{margin-top:auto;padding:16px 4px 0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2)}
.bal b{color:var(--ink)}
.bal .btn{margin-top:6px;text-align:center}
.content{flex:1;min-width:0}
main{max-width:1240px;margin:0 auto;padding:28px 24px 72px}
main.narrow{max-width:1000px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em} h2{font-size:16px;margin:0 0 12px} h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--ink2);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;min-width:0;overflow-wrap:anywhere}
.card.hl{border:2px solid var(--brand)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g2{grid-template-columns:1fr} main{padding:18px 16px 60px}
  .app{flex-direction:column} aside.sidebar{width:auto;height:auto;position:static;padding:10px 16px;border-right:none;border-bottom:1px solid var(--line)}
  .logo{padding:4px 0 8px} nav.main{flex-direction:row;flex-wrap:wrap;gap:4px}
  .bal{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:10px 0 0} .bal .btn{margin-top:0}}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:600;white-space:nowrap;cursor:pointer;display:inline-block}
.btn:hover{border-color:var(--ink3);text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.big{padding:13px 18px;font-size:15px;border-radius:10px;width:100%;text-align:center}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;pointer-events:none}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);min-width:0;overflow-wrap:anywhere}
.stat .k{font-size:12px;color:var(--ink2);font-weight:500} .stat .v{font-size:22px;font-weight:700;letter-spacing:-.01em} .stat .h{font-size:12px;color:var(--ink2)}
.big-num{font-size:34px;font-weight:700;letter-spacing:-.02em}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--line2);color:var(--ink2)}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-brand{background:var(--brand-soft);color:var(--brand)}
.notice{border-radius:10px;padding:10px 14px;margin-bottom:14px}
.notice.info{background:var(--brand-soft)} .notice.warn{background:var(--warn-soft)} .notice.bad{background:var(--bad-soft)} .notice.ok{background:var(--ok-soft)}
.bar{height:12px;border-radius:999px;background:var(--line2);overflow:hidden} .bar>i{display:block;height:100%;background:var(--brand);transition:width .4s}
.bar.thin{height:6px} .bar.thin>i{background:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-sort]{cursor:pointer} th .arr{color:var(--brand)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:none}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);position:relative}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px} .tbar input[type=search]{max-width:300px}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink2)}
.pager .pg{display:flex;gap:6px;align-items:center} .pager select{width:auto;padding:4px 8px}
.muted{color:var(--ink2)} .small{font-size:12px} .nowrap{white-space:nowrap} .right{text-align:right}
.layout{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.filters{flex:999 1 560px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.side{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
@media (max-width:960px){.side{position:static}}
.fhead{padding:14px 18px;border-bottom:1px solid var(--line)}
.fgroup{border-bottom:1px solid var(--line2)} .fgroup:last-child{border-bottom:none}
.fgroup>button.gh{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;padding:12px 18px;font-weight:700;cursor:pointer;color:var(--ink)}
.fgroup .gb{padding:0 18px 8px}
.field{padding:10px 0;border-top:1px solid var(--line2);position:relative} .field:first-child{border-top:none}
.flabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.flabel b{font-weight:600} .fnote{font-size:12px;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:2px;border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;font-weight:500;background:var(--brand-soft);color:var(--brand)}
.chip.out{background:var(--out-soft);color:var(--out)}
.chip button{border:none;background:none;color:inherit;padding:0 6px;font-size:15px;line-height:1;cursor:pointer}
.adder{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.adder input,.adder select{flex:1 1 200px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:none;background:var(--panel);padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--brand);color:var(--brand-ink)} .seg button.on.x{background:var(--out);color:#fff}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.sugg{position:absolute;z-index:5;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.14);max-height:280px;overflow:auto;margin-top:4px}
.sugg .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;border-top:1px solid var(--line2)}
.sugg .it:first-child{border-top:none} .sugg .it.hl{background:var(--brand-soft)}
.pills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pills button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 0;font-weight:600;cursor:pointer}
.pills button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:8px 12px;color:var(--ink2);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.skiprow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line2)}
.linkbtn{border:none;background:none;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:9;max-width:90vw}
.toast.err{background:var(--bad);color:#fff}
.center-box{max-width:380px;margin:12vh auto;padding:0 16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px} .kv>span:nth-child(odd){color:var(--ink2)}
.alert{padding:10px 24px;font-weight:600;color:#fff}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
code{font-size:12.5px;background:var(--line2);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n==null ? "—" : Number(n).toLocaleString("en-US");
const when = t => t ? new Date(t*1000).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
const qs = o => Object.entries(o).filter(([,v]) => v!=="" && v!=null).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join("&");
let META = null, POLL = null, ROUTE_SEQ = 0;

async function api(path, opts={}) {
  const o = {method: opts.method || (opts.body ? "POST" : "GET"), headers:{}};
  if (opts.body instanceof FormData) o.body = opts.body;
  else if (opts.body !== undefined) { o.headers["Content-Type"]="application/json"; o.body=JSON.stringify(opts.body); }
  const r = await fetch(path, o);
  if (r.status === 401 && !path.startsWith("/api/auth")) { location.hash = "#/login"; throw new Error("Please log in."); }
  let d = null; try { d = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error((d && (d.error || d.detail)) || ("Error " + r.status));
  return d;
}
function toast(msg, err) { const t = document.createElement("div"); t.className = "toast"+(err?" err":""); t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), err?7000:3000); }
async function busy(btn, fn) { const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + old;
  try { return await fn(); } catch(e) { toast(e.message, true); } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } } }
const ss = {get(k,d){ try { const v = sessionStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } },
            set(k,v){ try { sessionStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }};

// ------------------------------------------------------------ paged table (server sends one page at a time)
function pagedTable(host, key, o) {
  const st = Object.assign({offset:0, limit:(META && META.defaults.page_size)||50, q:"", sort:o.sort||"", dir:o.dir||"asc"}, ss.get("lp.t."+key,{}), o.reset?{offset:0}:{});
  const save = () => ss.set("lp.t."+key, st);
  host.innerHTML = `<div class="tbar">${o.search===false?"":`<input type="search" data-q value="${esc(st.q)}" placeholder="${esc(o.placeholder||"Search")}" aria-label="Search">`}${o.toolbar||""}</div>
    <div class="tablewrap"><table><thead><tr>${o.cols.map(c=>`<th class="${c.cls||""}" ${c.sort?`data-sort="${c.sort}"`:""}>${c.label}</th>`).join("")}</tr></thead><tbody data-body><tr><td colspan="${o.cols.length}" class="muted">Loading…</td></tr></tbody></table></div>
    <div class="pager"><span data-info></span><div class="pg"><button class="btn small" data-prev>Previous</button><span data-no></span><button class="btn small" data-next>Next</button>
    <label class="small" style="display:flex;gap:6px;align-items:center;margin-left:6px">Rows <select data-size>${[25,50,100,250].map(n=>`<option ${n===st.limit?"selected":""}>${n}</option>`).join("")}</select></label></div></div>`;
  let seq = 0, last = null;
  async function load() {
    const my = ++seq; let d;
    try { d = await api(o.url(st)); } catch(e) { $("[data-body]",host).innerHTML = `<tr><td colspan="${o.cols.length}">${esc(e.message)}</td></tr>`; return; }
    if (my !== seq || !host.isConnected) return;
    if (st.offset && st.offset >= d.total) { st.offset = Math.max(0, Math.floor((d.total-1)/st.limit)*st.limit); save(); return load(); }
    last = d;
    $("[data-body]",host).innerHTML = d.rows.length ? d.rows.map(r=>`<tr>${o.cols.map(c=>`<td class="${c.cls||""}">${c.html(r)}</td>`).join("")}</tr>`).join("")
      : `<tr><td colspan="${o.cols.length}" class="muted">${esc(st.q ? "Nothing matches your search." : (o.empty||"Nothing here yet."))}</td></tr>`;
    const pages = Math.max(1, Math.ceil(d.total/st.limit)), page = Math.floor(st.offset/st.limit)+1;
    $("[data-info]",host).textContent = d.total ? `${fmt(st.offset+1)}–${fmt(Math.min(d.total, st.offset+st.limit))} of ${fmt(d.total)}` : "0 rows";
    $("[data-no]",host).textContent = `Page ${fmt(page)} of ${fmt(pages)}`;
    $("[data-prev]",host).disabled = st.offset <= 0; $("[data-next]",host).disabled = st.offset + st.limit >= d.total;
    $$("th[data-sort]",host).forEach(th => { th.querySelector(".arr")?.remove(); if (th.dataset.sort === st.sort) th.insertAdjacentHTML("beforeend", ` <span class="arr">${st.dir==="asc"?"▲":"▼"}</span>`); });
    o.onLoad && o.onLoad(d);
  }
  let t;
  host.addEventListener("input", e => { if (e.target.matches("[data-q]")) { clearTimeout(t); t = setTimeout(()=>{ st.q = e.target.value.trim(); st.offset = 0; save(); load(); }, 250); } });
  host.addEventListener("change", e => { if (e.target.matches("[data-size]")) { st.limit = +e.target.value; st.offset = 0; save(); load(); } });
  host.addEventListener("click", e => {
    if (e.target.closest("[data-prev]")) { st.offset = Math.max(0, st.offset - st.limit); save(); load(); }
    if (e.target.closest("[data-next]")) { st.offset += st.limit; save(); load(); }
    const th = e.target.closest("th[data-sort]");
    if (th) { st.dir = st.sort === th.dataset.sort && st.dir === "asc" ? "desc" : "asc"; st.sort = th.dataset.sort; st.offset = 0; save(); load(); }
  });
  load();
  return {reload: load, state: st, data: () => last};
}

// ------------------------------------------------------------ shell
const NAV = [["#/new","New pull"],["#/history","History"],["#/accounts","Accounts"],["#/dnp","Do-not-pull"],["#/settings","Settings"]];
function balHtml(ov) {
  const accs = (ov.accounts||[]).filter(a=>a.enabled);
  return accs.map(a=>`<span>${esc(a.name)}: <b>${fmt(a.balance)}</b></span>`).join("") +
    `<span>This month: <b>${fmt(ov.spent_this_month)}</b>${ov.monthly_budget?` of ${fmt(ov.monthly_budget)}`:""}</span>
     <button class="btn small danger" id="stopAll" title="Stops every pull now. People already sent to Seamless still come back.">Emergency stop</button>`;
}
function alerts(ov) {
  let h = "";
  if (!ov.spending_enabled) h += `<div class="alert" role="alert" style="background:var(--bad)">Spending is switched off (SPENDING_ENABLED=0 in .env). Nothing is searched or researched.</div>`;
  if ((ov.low||[]).length) h += `<div class="alert" role="alert" style="background:var(--bad)">Low Seamless balance on ${esc(ov.low.join(", "))}. Top up, or add another account on the Accounts page.</div>`;
  (ov.shared_pools||[]).forEach(g => h += `<div class="alert" role="alert" style="background:#8A5A00">${esc(g.names.join(" and "))} show exactly the same balance (${fmt(g.balance)}): probably one shared Seamless credit pool. Ask Seamless whether your users have separate credits.</div>`);
  return h;
}
function shell(content, narrow) {
  const h = location.hash || "#/new";
  return `<div class="app"><aside class="sidebar"><div class="logo">Lead Puller</div>
    <nav class="main" aria-label="Main">${NAV.map(([href,l])=>`<a href="${href}" class="${h.startsWith(href)||(href==="#/history"&&h.startsWith("#/pull/"))?"on":""}">${l}</a>`).join("")}</nav>
    <div class="bal" id="bal">${balHtml(META.overview)}</div></aside>
    <div class="content"><div id="alerts">${alerts(META.overview)}</div><main id="main" class="${narrow?"narrow":""}">${content}</main></div></div>`;
}
function refreshTop(ov) { if (!ov) return; META.overview = ov; $("#bal") && ($("#bal").innerHTML = balHtml(ov)); $("#alerts") && ($("#alerts").innerHTML = alerts(ov)); }
const setMain = h => { $("#main").innerHTML = h; };

async function route() {
  clearInterval(POLL); POLL = null; const my = ++ROUTE_SEQ;
  const st = await api("/api/auth/status");
  if (!st.logged_in) return renderLogin(st.no_password);
  if ((location.hash||"") === "#/login") { location.hash = "#/new"; return; }
  META = await api("/api/meta");
  if (my !== ROUTE_SEQ) return;
  const h = location.hash || "#/new"; let m;
  const narrow = /^#\/(pull|accounts|dnp|settings)/.test(h);
  $("#app").innerHTML = shell('<div class="muted">Loading…</div>', narrow);
  if ((m = h.match(/^#\/pull\/(\d+)/))) return renderPull(+m[1]);
  if ((m = h.match(/^#\/new(?:\?from=(\d+))?/))) return renderNew(m[1] ? +m[1] : null);
  ({"#/history":renderHistory, "#/accounts":renderAccounts, "#/dnp":renderDnp, "#/settings":renderSettings}[h] || (()=>renderNew(null)))();
}
window.addEventListener("hashchange", route);
document.addEventListener("click", e => {
  if (e.target.id === "stopAll") {
    if (!confirm("Stop ALL pulls now? Nothing more is searched or researched. People already sent to Seamless still come back.")) return;
    api("/api/stop-all", {body:{}}).then(r => { toast(`Stopped ${r.stopped} pull(s).`); route(); }).catch(err => toast(err.message, true));
  }
});

function renderLogin(noPassword) {
  $("#app").innerHTML = `<div class="center-box"><div class="card"><h1>Lead Puller</h1>${noPassword ?
    `<div class="notice warn">No password is set. Ask your developer to add <b>APP_PASSWORD</b> to .env and run <code>docker compose up -d</code>.</div>` :
    `<p class="sub">Log in to continue.</p><form id="lf"><label for="pw" class="small"><b>Password</b></label><input type="password" id="pw" autocomplete="current-password" autofocus style="margin:6px 0 12px">
     <button class="btn primary big">Log in</button></form>`}</div></div>`;
  if (noPassword) return;
  $("#lf").onsubmit = async e => { e.preventDefault();
    try { await api("/api/auth/login", {body:{password:$("#pw").value}}); location.hash = "#/new"; route(); } catch(err) { toast(err.message, true); } };
}

// ------------------------------------------------------------ new pull
let NP = null;     // the new-pull form state
const GROUPS_OPEN = {People:true, Location:true, Company:true, Signals:false, Quality:true};
function fieldsBy() { const g = {}; META.fields.forEach(f => (g[f.group] = g[f.group] || []).push(f)); return g; }
async function renderNew(fromId) {
  const d = META.defaults;
  NP = {filters: JSON.parse(JSON.stringify(d.filters)), target: d.target, max: null, maxEdited: false, account: "auto",
        cap: d.max_per_company, name: "", prompt: "", count: null};
  if (fromId) { try { const p = await api("/api/pulls/" + fromId);
    Object.assign(NP, {filters: p.filters, target: p.target, max: p.max_credits, maxEdited: true, account: p.account_choice, cap: p.max_per_company, name: p.name, prompt: p.prompt}); } catch(e) {} }
  const accs = META.overview.accounts.filter(a => a.enabled);
  setMain(`<h1>New pull</h1><p class="sub">Pick filters like in Seamless, say how many emails you want, press Start. Nobody you've pulled before, on any account, is pulled or paid for again.</p>

function drawFilters() {
  const groups = fieldsBy();
  $("#fbody").innerHTML = Object.entries(groups).map(([g, fs]) => {
    const set = fs.filter(f => NP.filters[f.key] !== undefined && !(f.key==="technologiesIsOr")).length;

    return `<div class="fgroup"><button type="button" class="gh" data-g="${esc(g)}" aria-expanded="${!!open}">${esc(g)} <span class="small muted">${set?`${set} set · `:""}${open?"Hide":"Show"}</span></button>
      <div class="gb ${open?"":"hide"}">${fs.map(fieldHtml).join("")}</div></div>`; }).join("");
  wireFilters();
}
const EXNOTE = {seamless:"Exclude: Seamless leaves them out (free)", complement:"Exclude: Seamless leaves them out (free)", tool:"Exclude: skipped before paying", none:""};
function fieldHtml(f) {
  const v = NP.filters[f.key];
  if (f.kind === "bool") return `<div class="field"><label class="row" style="gap:8px;font-weight:600"><input type="checkbox" data-bool="${f.key}" ${v?"checked":""} style="width:auto"> ${esc(f.label)}</label>${f.help?`<div class="fnote">${esc(f.help)}</div>`:""}</div>`;
  if (f.kind === "int") return `<div class="field"><div class="flabel"><b>${esc(f.label)}</b></div><input type="number" data-int="${f.key}" min="${f.min||0}" value="${v??""}" placeholder="Not set" style="max-width:160px">${f.help?`<div class="fnote">${esc(f.help)}</div>`:""}</div>`;
  if (f.kind === "choice") { const lab = f.option_labels || {};
    const any = f.key === "locationType" ? `Default: ${esc(lab[META.defaults.location_default]||META.defaults.location_default)}` : "Any";
    return `<div class="field"><div class="flabel"><b>${esc(f.label)}</b></div><select data-choice="${f.key}" style="max-width:300px"><option value="">${any}</option>${f.options.map(o=>`<option value="${esc(o)}" ${String(v)===String(o)?"selected":""}>${esc(lab[o]||o)}</option>`).join("")}</select></div>`; }
  const ins = (v&&v.in)||[], outs = (v&&v.out)||[], canOut = f.exclude && f.exclude !== "none";
  const mode = (NP.mode||{})[f.key] || "in";
  const chips = ins.map(x=>`<span class="chip">${esc(x)}<button type="button" data-rm="${f.key}|in|${esc(x)}" aria-label="Remove ${esc(x)}">×</button></span>`).join("") +
                outs.map(x=>`<span class="chip out">not: ${esc(x)}<button type="button" data-rm="${f.key}|out|${esc(x)}" aria-label="Remove ${esc(x)}">×</button></span>`).join("");
  const seg = `<span class="seg" role="group" aria-label="Include or exclude"><button type="button" class="${mode==="in"?"on":""}" data-mode="${f.key}|in">Include</button><button type="button" class="x ${mode==="out"?"on":""}" data-mode="${f.key}|out" ${canOut?"":"disabled title=\"Seamless's API can't exclude this\""}>Exclude</button></span>`;
  let adder;
  if (f.options) adder = `<select data-add="${f.key}" aria-label="Add ${esc(f.label)}"><option value="">+ Add from Seamless's list…</option>${f.options.filter(o=>!ins.includes(o)&&!outs.includes(o)).map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;
  else adder = `<input data-text="${f.key}" ${f.lookup?`data-lookup="${esc(f.lookup)}"`:""} ${f.suggest?`data-suggest="${f.suggest}"`:""} autocomplete="off" placeholder="${f.lookup?"Start typing, then pick from Seamless's place list":f.suggest?"Start typing a technology":"Type and press Enter (comma for several)"}" aria-label="Add ${esc(f.label)}">`;
  const bundles = f.suggest === "tech" ? `<div class="small" style="margin-top:6px">Bundles: ${Object.keys(META.tech_bundles).map(b=>`<button type="button" class="linkbtn" data-bundle="${esc(b)}">${esc(b)}</button>`).join(" · ")}</div>` : "";
  return `<div class="field" data-key="${f.key}"><div class="flabel"><b>${esc(f.label)}</b><span class="fnote">${esc(EXNOTE[f.exclude||"none"])}</span></div>
    ${chips?`<div class="chips">${chips}</div>`:""}<div class="adder">${adder}${seg}</div>${bundles}${f.help?`<div class="fnote" style="margin-top:4px">${esc(f.help)}</div>`:""}</div>`;
}
function addVal(key, side, val) {
  const f = META.fields.find(x=>x.key===key); val = String(val||"").trim(); if (!val) return;
  const cur = NP.filters[key] || {in:[], out:[]}; cur.in = cur.in||[]; cur.out = cur.out||[];
  if (cur.in.includes(val) || cur.out.includes(val)) return;
  if (side === "in" && cur.in.length >= (f.max||100)) return toast(`${f.label}: up to ${f.max} values.`, true);
  cur[side].push(val); NP.filters[key] = cur;
}
function rmVal(key, side, val) { const cur = NP.filters[key]; if (!cur) return; cur[side] = (cur[side]||[]).filter(x=>x!==val);
  if (!(cur.in||[]).length && !(cur.out||[]).length) delete NP.filters[key]; }
function wireFilters() {
  const root = $("#fbody");
  root.onclick = e => {
    const gh = e.target.closest("[data-g]"); if (gh) { GROUPS_OPEN[gh.dataset.g] = gh.nextElementSibling.classList.contains("hide"); drawFilters(); return; }
    const rm = e.target.closest("[data-rm]"); if (rm) { const [k,s,...v] = rm.dataset.rm.split("|"); rmVal(k,s,v.join("|")); drawFilters(); return; }
    const md = e.target.closest("[data-mode]"); if (md) { const [k,s] = md.dataset.mode.split("|"); NP.mode = NP.mode||{}; NP.mode[k] = s; drawFilters(); return; }
    const pk = e.target.closest("[data-pick]"); if (pk) { const [k,s] = pk.dataset.side.split("|"); addVal(k, s, pk.dataset.pick); drawFilters(); setTimeout(()=>$(`[data-text="${k}"]`)?.focus(),0); return; }
    const bd = e.target.closest("[data-bundle]"); if (bd) { (META.tech_bundles[bd.dataset.bundle]||[]).forEach(t => addVal("technologies","in",t)); drawFilters(); return; }
  };
  root.onchange = e => {
    const t = e.target;
    if (t.dataset.add !== undefined && t.value) { addVal(t.dataset.add, (NP.mode||{})[t.dataset.add]||"in", t.value); drawFilters(); }
    if (t.dataset.bool) { if (t.checked) NP.filters[t.dataset.bool] = true; else delete NP.filters[t.dataset.bool]; }
    if (t.dataset.int) { const n = parseInt(t.value,10); if (n>0) NP.filters[t.dataset.int] = n; else delete NP.filters[t.dataset.int]; }
    if (t.dataset.choice) { if (t.value) NP.filters[t.dataset.choice] = t.value; else delete NP.filters[t.dataset.choice]; }
  };
  let lt, lseq = 0;
  root.oninput = e => {
    const t = e.target; if (!t.dataset.text || !(t.dataset.lookup || t.dataset.suggest)) return;
    clearTimeout(lt); $$(".sugg", root).forEach(s=>s.remove());
    const q = t.value.trim(); if (q.length < (t.dataset.lookup ? 2 : 1)) return;
    lt = setTimeout(async () => { const my = ++lseq;
      const url = t.dataset.lookup ? `/api/lookup/places?${qs({q, types:t.dataset.lookup})}` : `/api/lookup/tech?${qs({q})}`;
      let rows = []; try { rows = (await api(url)).rows; } catch(err) { return; }
      if (my !== lseq || !t.isConnected) return;
      const key = t.dataset.text, f = META.fields.find(x=>x.key===key), canOut = f.exclude && f.exclude!=="none";
      const box = document.createElement("div"); box.className = "sugg"; box.setAttribute("role","listbox");
      box.innerHTML = rows.length ? rows.map((r,i)=>`<div class="it ${i===0?"hl":""}"><span>${esc(r.value)} <span class="small muted">${r.seen?`· ✓ seen at ${fmt(r.seen)} companies in your pulls`:r.type?`· ${esc(r.type)}`:""}</span></span>
        <span class="row" style="gap:6px"><button type="button" class="btn small" data-pick="${esc(r.value)}" data-side="${key}|in">Include</button>${canOut?`<button type="button" class="btn small" style="color:var(--out)" data-pick="${esc(r.value)}" data-side="${key}|out">Exclude</button>`:""}</span></div>`).join("")
        : `<div class="it small muted">${t.dataset.lookup?`Seamless doesn't know “${esc(q)}”. Check the spelling.`:`Not in the list yet. Press Enter to use “${esc(q)}” as written (Seamless matches names as written).`}</div>`;
      t.closest(".field").appendChild(box); }, 220);
  };
  root.onkeydown = e => {
    const t = e.target; if (!t.dataset.text) return;
    if (e.key === "Escape") { $$(".sugg", root).forEach(s=>s.remove()); return; }
    if (e.key !== "Enter") return; e.preventDefault();
    const key = t.dataset.text, side = (NP.mode||{})[key]||"in";
    const hl = $(".sugg .it.hl [data-pick]", t.closest(".field"));
    if (t.dataset.lookup && hl) addVal(key, side, hl.dataset.pick);
    else t.value.split(",").map(s=>s.trim()).filter(Boolean).forEach(v => addVal(key, side, v));
    drawFilters(); setTimeout(()=>$(`[data-text="${key}"]`)?.focus(),0);
  };
  root.addEventListener("focusout", e => { const t = e.target; if (!t.dataset || !t.dataset.text || t.dataset.lookup) return;
    setTimeout(() => { if (!t.isConnected || t.closest(".field")?.contains(document.activeElement)) return;
      if (t.value.trim() && !t.dataset.suggest) { t.value.split(",").map(s=>s.trim()).filter(Boolean).forEach(v=>addVal(t.dataset.text,(NP.mode||{})[t.dataset.text]||"in",v)); drawFilters(); } }, 150); });
}

      ${(s.skips||[]).length ? `<div style="margin-top:14px"><div class="small" style="font-weight:600;margin-bottom:4px">Why they were skipped (checked as each page arrived) · click to see who</div>
        ${s.skips.map(r=>`<div class="skiprow small"><button type="button" class="linkbtn" data-skip="${esc(r.kind)}">${esc(SKIP[r.kind]||r.example||r.kind)}</button><b>${fmt(r.n)}</b></div>`).join("")}</div>` : ""}
      <div class="small muted" style="margin-top:10px">Memory holds ${fmt(p.overview.people_pulled)} people pulled with this tool and ${fmt(p.overview.seamless_saved)} contacts already in your Seamless accounts (${fmt(p.overview.emails_in_memory)} emails), on every account.</div></section>
    ${p.slices.length ? `<section class="card" aria-label="Smart scanning"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Smart scanning</h2><span class="small muted">Search split by company size, freshest first. A slice is left for later when new people get too expensive to find.</span></div>
      <div class="tablewrap"><table><thead><tr><th>Slice</th><th class="right">Pages</th><th class="right">New people</th><th class="right">Per new email</th><th>Status</th></tr></thead><tbody>
      ${p.slices.map(x=>{ const [l,c] = SLICE[x.state]||[x.state,""]; return `<tr><td>${esc(x.label)}${x.note?`<div class="small muted">${esc(x.note)}</div>`:""}</td><td class="right">${fmt(x.pages)}</td><td class="right">${x.new_pct==null?"—":x.new_pct+"%"}</td><td class="right">${x.per_new_email ?? "—"}</td><td><span class="badge ${c}">${l}</span></td></tr>`; }).join("")}</tbody></table></div>
      <div class="small muted" style="margin-top:10px">Old people never stop a pull: they're skipped and never researched. It ends at ${fmt(p.target)} emails or ${fmt(p.max_credits)} credits; a slice where finding a new email costs more than ${META.defaults.move_on} extra search credits is left for later.</div></section>` : ""}`;
  $$("#live [data-skip]").forEach(b => b.onclick = () => { PV.view = "skipped"; PV.kind = b.dataset.skip; drawResults(p, true); $("#results").scrollIntoView({behavior:"smooth"}); });
}
async function pullAction(p, btn) {
  const a = btn.dataset.act;
  if (a === "stop" && !confirm("Stop? Nothing more is searched or researched. Everything found so far is kept; people already sent to Seamless still come back.")) return;
  if (a === "finish-now" && !confirm("Finish now? People still waiting on Seamless are filled in free if their answers arrive later.")) return;
  if (a === "delete") { if (!confirm("Delete this pull? People in it stay remembered, so they're never pulled or paid for again.")) return;
    return busy(btn, async () => { await api("/api/pulls/"+p.id, {method:"DELETE"}); location.hash = "#/history"; }); }
  busy(btn, async () => { const r = await api(`/api/pulls/${p.id}/${a}`, {body:{}}); if (a === "rerun") location.hash = "#/pull/" + r.id; else renderPull(p.id); });
}
function drawResults(p, keep) {
  const host = $("#results"); const s = p.stats; if (!host) return;
  if (!s.researched && p.status !== "done") { host.innerHTML = ""; return; }
  const view = PV.view, cols = META.defaults.columns;
  host.innerHTML = `<section class="card hl" aria-label="Download"><h2>Download</h2>
      <p class="small muted" style="margin:-6px 0 12px">${p.status==="done"?"":"You can already download what has come back. "}Invalid emails, shared emails and your do-not-pull list are left out.</p>
      <div class="row"><a class="btn primary" id="dlMain" href="/api/pulls/${p.id}/download?kind=anavmail">Download for AnavMail (CSV, ${fmt(s.downloadable)})</a>
        <a class="btn" href="/api/pulls/${p.id}/download?kind=all&format=xlsx">Everything, all columns (Excel)</a>
        <a class="btn" id="dlNo" href="/api/pulls/${p.id}/download?kind=no_email" ${s.no_email?"":'aria-disabled="true"'}>${fmt(s.no_email)} without email (LinkedIn, phone)</a></div>
      <div class="small muted" style="margin-top:10px">AnavMail columns: <b style="color:var(--ink)">${esc(cols.join(", "))}</b> (DEFAULT_COLUMNS in .env)</div></section>
    <section class="card"><div class="tabs" role="tablist">${[["emails","With email"],["no_email","No email"],["skipped","Skipped"]].map(([v,l])=>`<button type="button" role="tab" class="${v===view?"on":""}" data-v="${v}">${l}</button>`).join("")}</div>
      ${view==="skipped"&&PV.kind?`<div class="small" style="margin-bottom:8px">Showing: <b>${esc(SKIP[PV.kind]||PV.kind)}</b> · <button type="button" class="linkbtn" id="allSkips">all reasons</button></div>`:""}<div id="peopleTable"></div></section>`;
  $$("#results .tabs [data-v]").forEach(b => b.onclick = () => { PV.view = b.dataset.v; PV.kind = null; drawResults(p, true); });
  $("#allSkips") && ($("#allSkips").onclick = () => { PV.kind = null; drawResults(p, true); });
  const base = [{label:"Name", sort:"name", html:r=>`<span class="nowrap">${r.li_url?`<a href="${esc(r.li_url.startsWith("http")?r.li_url:"https://"+r.li_url)}" target="_blank" rel="noopener">${esc(r.name)}</a>`:esc(r.name)}</span>`},
    {label:"Title", sort:"title", html:r=>esc(r.title)}, {label:"Company", sort:"company", html:r=>`${esc(r.company)}<div class="small muted">${esc(r.domain||"no website")}${r.size?` · ${esc(r.size)}`:""}</div>`},
    {label:"Country", sort:"country", html:r=>esc(r.country)}];
  const extra = view === "skipped" ? [{label:"Why skipped", html:r=>`<span class="small">${esc(r.skip_reason)}</span>`}]
    : view === "emails" ? [{label:"Email", sort:"email", html:r=>`${esc(r.email)} ${r.email_status&&r.email_status.toLowerCase()!=="valid"?`<span class="badge b-warn">${esc(r.email_status)}</span>`:""}${r.filled_free?' <span class="badge b-ok">free</span>':""}`}, {label:"Phone", html:r=>`<span class="nowrap">${esc(r.phone||"")}</span>`}]
    : [{label:"Seamless said", html:r=>`<span class="small">${esc(r.research_status||"")}${r.research_message?`<div class="muted">${esc(r.research_message)}</div>`:""}</span>`}, {label:"Phone", html:r=>`<span class="nowrap">${esc(r.phone||"")}</span>`}];
  pagedTable($("#peopleTable"), `people.${p.id}.${view}.${PV.kind||""}`, {placeholder:"Search name, company, title, email or country", sort:"id",
    url: st => `/api/pulls/${p.id}/people?${qs({view, kind:PV.kind||"", offset:st.offset, limit:st.limit, q:st.q, sort:st.sort, dir:st.dir})}`,
    empty: view==="emails" ? "No emails yet." : "Nobody here.", cols: base.concat(extra)});
}

// ------------------------------------------------------------ history
async function renderHistory() {
  const ov = META.overview;
  setMain(`<h1>History</h1><p class="sub">Every pull, on every account. Download again any time; re-downloading never costs credits.</p>
    <div class="grid g3" style="margin-bottom:16px">
      <div class="stat"><div class="k">People ever pulled (all accounts)</div><div class="v">${fmt(ov.people_pulled)}</div><div class="h">plus ${fmt(ov.seamless_saved)} already in your Seamless accounts · never paid for again</div></div>
      <div class="stat"><div class="k">Credits this month</div><div class="v">${fmt(ov.spent_this_month)}</div><div class="h">${ov.monthly_budget?`of ${fmt(ov.monthly_budget)} (MONTHLY_CREDIT_BUDGET)`:"no monthly limit set"}</div></div>
      <div class="stat"><div class="k">Left this month</div><div class="v">${ov.budget_left==null?"—":fmt(ov.budget_left)}</div><div class="h">${ov.budget_left==null?"":"budget, all accounts together"}</div></div></div>
    <section class="card" id="pullTable"></section>`);
  pagedTable($("#pullTable"), "pulls", {placeholder:"Search pull name", empty:"No pulls yet. Start one on New pull.",
    url: st => `/api/pulls?${qs({offset:st.offset, limit:st.limit, q:st.q})}`,
    cols: [{label:"Pull", html:r=>`<a href="#/pull/${r.id}"><b>${esc(r.name)}</b></a><div class="small muted">${esc(r.stop_reason||"")}</div>`},
      {label:"Status", html:r=>{ const [l,c] = STATUS[r.status]||[r.status,""]; return `<span class="badge ${c}">${l}</span>`; }},
      {label:"When", html:r=>`<span class="nowrap">${when(r.created_at)}</span>`}, {label:"Account", html:r=>`<span class="small">${esc(r.accounts||"—")}</span>`},
      {label:"Emails", cls:"right", html:r=>`<b>${fmt(r.emails)}</b> <span class="muted">/ ${fmt(r.target)}</span>`}, {label:"Credits", cls:"right", html:r=>fmt(r.credits)},
      {label:"Per email", cls:"right", html:r=>r.per_email ?? "—"},
      {label:"<span class='sr'>Actions</span>", cls:"right nowrap", html:r=>`<a href="/api/pulls/${r.id}/download?kind=anavmail">Download</a> · <a href="#/new?from=${r.id}">Change filters</a>`}]});
}

// ------------------------------------------------------------ accounts
async function renderAccounts() {
  const ov = await api("/api/accounts"); refreshTop(ov);
  const accs = ov.accounts;
  setMain(`<h1>Seamless accounts</h1><p class="sub">Pulls use the accounts in this order: when one runs low, the pull carries on with the next. All accounts share one memory of everyone pulled, so nobody found with one key is pulled or paid for again with another.</p>
    ${(ov.shared_pools||[]).map(g=>`<div class="notice warn"><b>${esc(g.names.join(" and "))} show exactly the same balance (${fmt(g.balance)}).</b> Probably one shared credit pool. Ask Seamless whether your users have separate credits.</div>`).join("")}
    <div class="grid g2">${accs.map((a,i)=>`<section class="card" style="margin:0" data-aid="${a.id}"><div class="row between" style="margin-bottom:10px">
        <h2 style="margin:0">${esc(a.name)} <span class="small muted" style="font-weight:500">· ${i===0?"used first":"used when the one above is low"}</span></h2>
        ${a.last_error?'<span class="badge b-bad">Key not accepted</span>':a.enabled?'<span class="badge b-ok">On</span>':'<span class="badge">Off</span>'}</div>
      ${a.last_error?`<div class="notice bad small">${esc(a.last_error)}</div>`:""}
      <div class="kv"><span>Key</span><span><code>${esc(a.key)}</code>${a.source==="env"?' <span class="small muted">from .env</span>':""}</span>
        <span>Balance</span><span><b>${fmt(a.balance)}</b> credits ${a.balance_at?`<span class="small muted">· checked ${when(a.balance_at)}</span>`:""}</span>
        <span>Spent this month</span><span>${fmt(a.spent_this_month)}</span><span>Can still spend</span><span>${a.usable==null?"—":fmt(a.usable)}</span>
        <span>Monthly budget</span><span><input type="number" min="0" value="${a.monthly_budget||""}" placeholder="No own limit" data-budget style="width:130px" aria-label="Monthly budget for ${esc(a.name)}"></span>
        <span>Name</span><span><input value="${esc(a.name)}" data-name style="max-width:220px" aria-label="Name"></span></div>
      <div class="row" style="margin-top:14px"><button class="btn small" data-check>Check balance (free)</button>${a.source==="env"?"":`<button class="btn small" data-rekey>Replace key</button>`}
        <button class="btn small" data-toggle>${a.enabled?"Switch off":"Switch on"}</button>${i>0?`<button class="btn small" data-up>Use first</button>`:""}${a.source==="env"?"":`<button class="btn small danger" data-del>Delete</button>`}</div></section>`).join("")}
      <section class="card" style="margin:0"><h2>Add a Seamless account</h2>
        <label for="naName" class="small"><b>Name</b></label><input id="naName" placeholder="e.g. Gaurav's Seamless" style="margin:4px 0 10px">
        <label for="naKey" class="small"><b>API key</b></label><input id="naKey" type="password" autocomplete="off" placeholder="Seamless → Settings → Public API" style="margin:4px 0 10px">
        <label for="naBud" class="small"><b>Monthly budget (optional)</b></label><input id="naBud" type="number" min="0" placeholder="No own limit" style="margin:4px 0 12px">
        <button class="btn primary" id="naAdd">Check key and add</button><div class="small muted" style="margin-top:6px">Checked with a free call first; a key Seamless doesn't accept is never saved. Only the last 4 characters are ever shown.</div></section></div>
    <section class="card" style="margin-top:16px"><h2>Spending history</h2><div id="ledger"></div></section>`);
  const aid = el => +el.closest("[data-aid]").dataset.aid;
  const patch = async (el, body, msg) => { try { await api(`/api/accounts/${aid(el)}`, {method:"PATCH", body}); toast(msg); renderAccounts(); } catch(e) { toast(e.message, true); } };
  $("#main").onchange = e => { if (e.target.matches("[data-budget]")) patch(e.target, {monthly_budget:+e.target.value||0}, "Budget saved.");
    if (e.target.matches("[data-name]")) patch(e.target, {name:e.target.value}, "Renamed."); };
  $("#main").onclick = e => { const b = e.target.closest("button"); if (!b || !b.closest("[data-aid]")) return; const a = accs.find(x=>x.id===aid(b));
    if (b.matches("[data-check]")) busy(b, async () => { await api(`/api/accounts/${a.id}/check`, {body:{}}); toast("Balance checked."); renderAccounts(); });
    if (b.matches("[data-toggle]")) patch(b, {enabled:!a.enabled}, a.enabled?"Switched off: pulls won't use it.":"Switched on.");
    if (b.matches("[data-up]")) patch(b, {priority:0}, "Now used first.");
    if (b.matches("[data-rekey]")) { const k = prompt("Paste the new API key for " + a.name + ":"); if (k) patch(b, {api_key:k}, "Key replaced."); }
    if (b.matches("[data-del]")) { if (!confirm("Delete this account? Its people stay remembered.")) return; busy(b, async () => { await api(`/api/accounts/${a.id}`, {method:"DELETE"}); renderAccounts(); }); } };
  $("#naAdd").onclick = e => busy(e.currentTarget, async () => { await api("/api/accounts", {body:{name:$("#naName").value.trim(), api_key:$("#naKey").value, monthly_budget:+$("#naBud").value||0}}); toast("Account added."); META = await api("/api/meta"); renderAccounts(); });
  pagedTable($("#ledger"), "ledger", {search:false, empty:"Nothing spent yet.", url: st => `/api/ledger?${qs({offset:st.offset, limit:st.limit})}`,
    cols: [{label:"When", html:r=>`<span class="nowrap">${when(r.at)}</span>`}, {label:"Pull", html:r=>r.pull_id?`<a href="#/pull/${r.pull_id}">${esc(r.pull_name||"#"+r.pull_id)}</a>`:'<span class="muted">—</span>'},
      {label:"Account", html:r=>esc(r.account_name||"")}, {label:"What", html:r=>esc(r.note)}, {label:"Credits", cls:"right", html:r=>fmt(r.credits)}, {label:"Balance after", cls:"right", html:r=>fmt(r.balance_after)}]});
}

// ------------------------------------------------------------ do-not-pull
async function renderDnp() {
  setMain(`<h1>Do-not-pull</h1><p class="sub">Your clients, competitors and AnavMail suppression list. Never pulled, never paid for, never downloaded, on any account.</p>
    <div class="grid g2"><section class="card" style="margin:0"><label for="dnpText"><b>Paste companies, websites, emails or LinkedIn links</b></label>
      <textarea id="dnpText" rows="6" placeholder="accenture.com&#10;Infosys&#10;someone@client.com" style="margin-top:6px"></textarea><button class="btn primary" id="dnpAdd" style="margin-top:8px">Add</button>
      <div class="small muted" style="margin-top:6px">A website also covers its subdomains. A company name matches whole words (“Infosys” blocks “Infosys BPM”, not “Infosysco”).</div></section>
    <section class="card" style="margin:0"><b>Or upload a CSV</b><p class="small muted">An AnavMail export or any CSV with email, website, company or LinkedIn columns.</p>
      <input type="file" id="dnpFile" accept=".csv,text/csv" aria-label="CSV file"><button class="btn" id="dnpUp" style="margin-top:8px">Upload</button><div id="dnpCounts" class="small" style="margin-top:12px"></div></section></div>
    <section class="card" style="margin-top:16px"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">The list</h2><button class="btn small danger" id="dnpClear">Clear entire list</button></div><div id="dnpTable"></div></section>`);
  const KIND = {email:"Email", domain:"Website", linkedin:"LinkedIn", company:"Company name"};
  const tbl = pagedTable($("#dnpTable"), "dnp", {placeholder:"Search the list", empty:"Nothing on the list yet.", url: st => `/api/exclusions?${qs({offset:st.offset, limit:st.limit, q:st.q})}`,
    onLoad: d => { const c = d.counts; $("#dnpCounts").innerHTML = `On the list: <b>${fmt(c.email||0)}</b> emails · <b>${fmt(c.domain||0)}</b> websites · <b>${fmt(c.company||0)}</b> companies · <b>${fmt(c.linkedin||0)}</b> LinkedIn profiles`; },
    cols: [{label:"Value", html:r=>esc(r.value)}, {label:"Type", html:r=>esc(KIND[r.kind]||r.kind)}, {label:"From", html:r=>`<span class="small muted">${esc(r.source)}</span>`},
      {label:"<span class='sr'>Remove</span>", cls:"right", html:r=>`<button class="btn small" data-delx="${esc(r.key)}">Remove</button>`}]});
  $("#dnpAdd").onclick = e => busy(e.currentTarget, async () => { const r = await api("/api/exclusions", {body:{text:$("#dnpText").value}}); toast(`Added ${fmt(r.added)}.`); $("#dnpText").value = ""; tbl.reload(); });
  $("#dnpUp").onclick = e => busy(e.currentTarget, async () => { const f = $("#dnpFile").files[0]; if (!f) return toast("Choose a CSV file.", true);
    const fd = new FormData(); fd.append("file", f); const r = await api("/api/exclusions/upload", {body:fd}); toast(`Added ${fmt(r.added)}.`); tbl.reload(); });
  $("#dnpClear").onclick = async () => { if (!confirm("Remove everything from the do-not-pull list?")) return; await api("/api/exclusions?everything=1", {method:"DELETE"}); tbl.reload(); };
  $("#dnpTable").addEventListener("click", async e => { const b = e.target.closest("[data-delx]"); if (!b) return; await api(`/api/exclusions?key=${encodeURIComponent(b.dataset.delx)}`, {method:"DELETE"}); tbl.reload(); });
}

// ------------------------------------------------------------ settings
async function renderSettings() {
  const s = await api("/api/settings");
  setMain(`<h1>Settings <span class="badge">v${esc(s.version)}</span></h1><p class="sub">Everything here is set in <b>.env</b> on the server. To change a value, ask your developer to edit that line and run <code>docker compose up -d</code>. Seamless keys are on the <a href="#/accounts">Accounts</a> page.</p>
    ${s.old_import && s.old_import.found ? `<div class="notice ok">Copied from the old Lead Puller on first start: ${fmt(s.old_import.people)} people already paid for, ${fmt(s.old_import.emails)} downloaded emails, ${fmt(s.old_import.do_not_pull)} do-not-pull entries, ${fmt(s.old_import.accounts)} Seamless accounts. None of them are paid for again.</div>` : ""}
    ${s.groups.map(g=>`<section class="card"><h2>${esc(g.group)}</h2><div class="tablewrap"><table><thead><tr><th style="width:250px">.env name</th><th style="width:180px">Value now</th><th>What it does</th></tr></thead><tbody>
      ${g.rows.map(r=>`<tr><td><code>${esc(r.key)}</code></td><td>${r.value!==""?`<b>${esc(r.value)}</b>`:'<span class="badge">not set</span>'}</td><td class="muted">${esc(r.help)}</td></tr>`).join("")}</tbody></table></div></section>`).join("")}`);
}

route().catch(e => toast(e.message, true));
</script>
