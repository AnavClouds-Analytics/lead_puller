<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Lead Puller · AnavClouds</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#15181e; --ink2:#4b5260; --ink3:#8a91a0; --line:#e3e6eb; --line2:#eef0f3;
  --brand:#1f5eff; --brand-ink:#ffffff; --brand-soft:#e8efff;
  --ok:#14804a; --ok-soft:#e5f4ec; --warn:#a15c00; --warn-soft:#fdf1df; --bad:#c22f2f; --bad-soft:#fbe7e7;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1115; --panel:#171a20; --ink:#e9ecf1; --ink2:#b4bac6; --ink3:#7d8494; --line:#2a2f38; --line2:#20242b;
  --brand:#5b8cff; --brand-ink:#0b0d12; --brand-soft:#1b2540;
  --ok:#43c37f; --ok-soft:#14291e; --warn:#f0a83a; --warn-soft:#2c2213; --bad:#ff7070; --bad-soft:#2d1717;
  --shadow:none;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.layout{display:flex;min-height:100vh}
nav.side{width:220px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.logo{font-weight:700;font-size:16px;padding:4px 10px 16px;letter-spacing:-.01em}
.logo small{display:block;font-weight:500;color:var(--ink3);font-size:12px}
nav.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:500}
nav.side a:hover{background:var(--line2);text-decoration:none}
nav.side a.on{background:var(--brand-soft);color:var(--brand)}
nav.side .spacer{flex:1}
.credit-chip{margin:8px 4px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--ink2)}
.credit-chip b{display:block;font-size:18px;color:var(--ink)}
main{flex:1;min-width:0;padding:28px 32px 80px;max-width:1240px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em} h2{font-size:16px;margin:0 0 12px} h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--ink3);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g2{grid-template-columns:1fr}
  .layout{flex-direction:column} nav.side{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px;border-right:none;border-bottom:1px solid var(--line)}
  nav.side .logo,nav.side .spacer,nav.side .credit-chip,nav.side .ver{display:none} nav.side a,nav.side button{flex:none} main{padding:18px 16px 60px}}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600;white-space:nowrap;display:inline-block}
.btn:hover{border-color:var(--ink3);text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)} .btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)} .btn.small{padding:4px 10px;font-size:13px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;pointer-events:none}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}
.stat .k{font-size:12px;color:var(--ink3);font-weight:500} .stat .v{font-size:22px;font-weight:700;letter-spacing:-.01em}
.stat .h{font-size:12px;color:var(--ink3)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--line2);color:var(--ink2)}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-brand{background:var(--brand-soft);color:var(--brand)}
.notice{border-radius:10px;padding:10px 14px;margin-bottom:14px;border:1px solid}
.notice.info{background:var(--brand-soft);border-color:transparent;color:var(--ink)}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.notice.bad{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.notice ul{margin:4px 0 0;padding-left:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink3);font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-sort]{cursor:pointer;user-select:none} th[data-sort]:hover{color:var(--ink)} th .arr{color:var(--brand)}
td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:none}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tbar input[type=search]{max-width:320px}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px;font-size:13px}
.pager .pg{display:flex;gap:6px;align-items:center}
.pager select{width:auto;padding:4px 8px}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:8px;background:var(--brand-soft);margin-bottom:10px}
.muted{color:var(--ink3)} .small{font-size:12px} .nowrap{white-space:nowrap} .right{text-align:right}
.steps{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}
.steps span{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--line2);color:var(--ink3)}
.steps span.on{background:var(--brand);color:var(--brand-ink)} .steps span.done{background:var(--brand-soft);color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px;font-weight:500}
.chip button{border:none;background:none;color:inherit;padding:0 6px;font-size:14px;line-height:1}
.field{margin-bottom:14px;position:relative} .field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.field .help{font-size:12px;color:var(--ink3);margin-top:4px}
.fgroup{border-top:1px solid var(--line2);padding-top:14px;margin-top:6px}
.fgroup>h3{color:var(--ink2)}
.sugg{position:absolute;z-index:5;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);max-height:260px;overflow:auto;margin-top:2px}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:none;background:none;padding:7px 10px;color:var(--ink)}
.sugg button:hover,.sugg button.hl{background:var(--brand-soft)}
.bar{height:10px;border-radius:999px;background:var(--line2);overflow:hidden} .bar>i{display:block;height:100%;background:var(--brand);transition:width .4s}
.prompt-box textarea{font-size:15px;min-height:110px;padding:14px}
.example{border:1px dashed var(--line);border-radius:999px;padding:4px 12px;background:none;color:var(--ink2);font-size:12.5px}
.example:hover{border-color:var(--brand);color:var(--brand)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:8px 12px;color:var(--ink3);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.radio input{width:auto;margin-top:3px} .radio.on{border-color:var(--brand);background:var(--brand-soft)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:9;max-width:90vw}
.toast.err{background:var(--bad);color:#fff}
.center-box{max-width:380px;margin:12vh auto;padding:0 16px}
.name-input{font-size:22px;font-weight:700;border:1px solid transparent;background:none;padding:2px 6px;margin-left:-7px;width:auto;min-width:200px}
.name-input:hover{border-color:var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px} .kv div:nth-child(odd){color:var(--ink3)}
.switch{display:flex;align-items:center;gap:8px;font-weight:500} .switch input{width:auto}
.skiprow{display:grid;grid-template-columns:1fr 70px 90px;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);align-items:start}
.skiprow:last-child{border-bottom:none}
.linkbtn{border:none;background:none;padding:0;color:var(--brand);font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}
.hide{display:none!important}
code{font-size:12.5px;background:var(--line2);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n==null ? "—" : Number(n).toLocaleString("en-US");
const when = t => t ? new Date(t*1000).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
const clock = t => t ? new Date(t*1000).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}) : "";
const plural = (n, one, many) => `${fmt(n)} ${n===1?one:(many||one+"s")}`;
let META = null, POLL = null, CURRENT_PULL = null;

async function api(path, opts={}) {
  const o = {method: opts.method || (opts.body ? "POST" : "GET"), headers:{}};
  if (opts.body instanceof FormData) o.body = opts.body;
  else if (opts.body !== undefined) { o.headers["Content-Type"]="application/json"; o.body=JSON.stringify(opts.body); }
  const r = await fetch(path, o);
  if (r.status === 401 && !path.startsWith("/api/auth")) { location.hash = "#/login"; throw new Error("Please log in."); }
  let data = null; try { data = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error((data && (data.error || data.detail)) || ("Error " + r.status));
  return data;
}
function toast(msg, err) {
  const t = document.createElement("div"); t.className = "toast" + (err?" err":""); t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), err?7000:3000);
}
async function busy(btn, fn) {
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + old;
  try { return await fn(); } catch(e) { toast(e.message, true); } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}
function ssGet(k, d) { try { const v = sessionStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } }
function ssSet(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

// ------------------------------------------------------------ paged table
// Every long list uses this: the server sends one page at a time; search and sort work across all pages;
// the page, search and sort are kept while you move around (and while research refreshes the screen).
const PAGE_SIZES = [25, 50, 100, 250];
function pagedTable(host, key, o) {
  const st = Object.assign({offset:0, limit: (META && META.defaults.table_page_size) || 50, q:"", sort:o.sort||"", dir:o.dir||"desc"},
                           ssGet("lp.t." + key, {}), o.reset ? {offset:0} : {});
  const save = () => ssSet("lp.t." + key, st);
  host.innerHTML = `<div class="tbar">${o.search===false?"":`<input type="search" data-q value="${esc(st.q)}" placeholder="${esc(o.placeholder||"Search")}" aria-label="Search">`}${o.toolbar||""}</div>
    <div data-sel-bar></div><div class="tablewrap"><table><thead><tr>${o.cols.map(c=>`<th class="${c.cls||""}" ${c.sort?`data-sort="${c.sort}"`:""}>${c.label}</th>`).join("")}</tr></thead><tbody data-body><tr><td colspan="${o.cols.length}" class="muted">Loading…</td></tr></tbody></table></div>
    <div class="pager"><span data-info class="muted"></span><div class="pg"><button class="btn small" data-prev>Previous</button><span data-pageno></span><button class="btn small" data-next>Next</button>
      <label class="small muted" style="display:flex;gap:6px;align-items:center;margin-left:8px">Rows <select data-size>${PAGE_SIZES.map(n=>`<option ${n===st.limit?"selected":""}>${n}</option>`).join("")}</select></label></div></div>`;
  let last = null, seq = 0;
  const marks = () => $$("th[data-sort]", host).forEach(th => { const on = th.dataset.sort === st.sort;
    th.querySelector(".arr")?.remove(); if (on) th.insertAdjacentHTML("beforeend", ` <span class="arr">${st.dir==="asc"?"▲":"▼"}</span>`); });
  async function load() {
    const my = ++seq;
    let d;
    try { d = await api(o.url({offset:st.offset, limit:st.limit, q:st.q, sort:st.sort, dir:st.dir})); }
    catch(e) { if (my === seq) $("[data-body]", host).innerHTML = `<tr><td colspan="${o.cols.length}" class="muted">${esc(e.message)}</td></tr>`; return; }
    if (my !== seq || !host.isConnected) return;
    if (st.offset && st.offset >= d.total) { st.offset = Math.max(0, Math.floor((d.total-1)/st.limit)*st.limit); save(); return load(); }
    last = d;
    $("[data-body]", host).innerHTML = d.rows.length ? d.rows.map(r => `<tr ${o.rowAttr?o.rowAttr(r):""}>${o.cols.map(c=>`<td class="${c.cls||""}">${c.html(r)}</td>`).join("")}</tr>`).join("")
      : `<tr><td colspan="${o.cols.length}" class="muted">${esc(st.q ? "Nothing matches your search." : (o.empty||"Nothing here yet."))}</td></tr>`;
    const pages = Math.max(1, Math.ceil(d.total / st.limit)), page = Math.floor(st.offset / st.limit) + 1;
    $("[data-info]", host).textContent = d.total ? `${fmt(st.offset+1)}–${fmt(Math.min(d.total, st.offset+st.limit))} of ${fmt(d.total)}` : "0 rows";
    $("[data-pageno]", host).textContent = `Page ${fmt(page)} of ${fmt(pages)}`;
    $("[data-prev]", host).disabled = st.offset <= 0; $("[data-next]", host).disabled = st.offset + st.limit >= d.total;
    marks();
    o.onLoad && o.onLoad(d, api_);
  }
  let t;
  host.addEventListener("input", e => { if (e.target.matches("[data-q]")) { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value.trim(); st.offset = 0; save(); load(); }, 250); } });
  host.addEventListener("change", e => { if (e.target.matches("[data-size]")) { st.limit = +e.target.value; st.offset = 0; save(); load(); } });
  host.addEventListener("click", e => {
    if (e.target.closest("[data-prev]")) { st.offset = Math.max(0, st.offset - st.limit); save(); load(); }
    if (e.target.closest("[data-next]")) { st.offset += st.limit; save(); load(); }
    const th = e.target.closest("th[data-sort]");
    if (th) { if (st.sort === th.dataset.sort) st.dir = st.dir === "asc" ? "desc" : "asc"; else { st.sort = th.dataset.sort; st.dir = th.dataset.sort.match(/name|company|title|country|pull|email/) ? "asc" : "desc"; }
      st.offset = 0; save(); load(); }
  });
  const api_ = {reload: load, state: st, data: () => last, host};
  load();
  return api_;
}
const qs = obj => Object.entries(obj).filter(([,v]) => v !== "" && v != null).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join("&");

// ------------------------------------------------------------ shell
const NAV = [["#/new","New pull"],["#/pulls","Pulls"],["#/companies","Companies"],["#/presets","Presets"],["#/exclusions","Do-not-pull list"],["#/accounts","Seamless accounts"],["#/credits","Credits"],["#/settings","Settings"]];
function chipHtml(c) {
  return `Seamless credits${(c.accounts||[]).filter(a=>a.enabled).length>1?" (all accounts)":""}<b>${fmt(c.balance)}</b>
    ${c.monthly_budget ? `${fmt(c.spent_this_month)} of ${fmt(c.monthly_budget)} used this month` : `${fmt(c.spent_this_month)} used this month`}`;
}
function shell(content) {
  const h = location.hash || "#/new";
  const c = META ? META.credits : {};
  return `<div class="layout"><nav class="side">
    <div class="logo">Lead Puller<small>AnavClouds · Seamless.AI</small></div>
    ${NAV.map(([href,label]) => `<a href="${href}" class="${h.startsWith(href)||(href==="#/pulls"&&h.startsWith("#/pull/"))?"on":""}">${label}</a>`).join("")}
    <div class="spacer"></div>
    <button class="btn danger" id="stopAll" style="margin:8px 4px 0" title="Stops every running pull. People already sent to Seamless still come back.">Emergency stop: all pulls</button>
    <div class="credit-chip" id="creditChip">${chipHtml(c)}</div>
    <a href="#" id="logout">Log out</a>
    <div class="small muted ver" style="padding:4px 10px">v${esc(META ? META.version : "")}</div>
  </nav><div style="flex:1;min-width:0"><div id="banners">${banners()}</div><main id="main">${content}</main></div></div>`;
}
function banners() {
  const c = META ? META.credits : {};
  const bar = (color, html) => `<div role="alert" style="background:${color};color:#fff;padding:10px 32px;font-weight:600">${html}</div>`;
  let h = "";
  if (c.spending_enabled === false) h += bar("var(--bad)", "Spending is switched off (SPENDING_ENABLED=0 in .env). Nothing will be searched or researched until it is set back to 1.");
  if (c.low_balance) h += bar("var(--bad)", `Seamless balance is low on ${esc((c.low_accounts||[]).join(", "))} (warning below ${fmt(c.low_balance_level)}, set in .env). Top up or add another account on the <a href="#/accounts" style="color:#fff;text-decoration:underline">Seamless accounts</a> page.`);
  (c.shared_pools||[]).forEach(g => h += bar("var(--warn)", `${esc(g.names.join(" and "))} show exactly the same balance (${fmt(g.balance)}): they're probably one shared credit pool, so it's counted once. Ask Seamless whether your users have separate credits.`));
  (c.mismatch||[]).filter(m => m.difference > 0).forEach(m => h += bar("var(--warn)", `${esc(m.account)}: ${esc(m.message)} <a href="#/credits" style="color:#fff;text-decoration:underline">Details</a>`));
  return h;
}
function refreshChrome(credits) {
  if (credits) META.credits = credits;
  const bn = $("#banners"); if (bn) bn.innerHTML = banners();
  const cc = $("#creditChip"); if (cc) cc.innerHTML = chipHtml(META.credits);
}
async function refreshMeta() { META = await api("/api/meta"); }

async function route() {
  clearInterval(POLL); POLL = null; CURRENT_PULL = null;
  const h = location.hash || "#/new";
  const st = await api("/api/auth/status");
  if (!st.logged_in) return renderLogin(st.no_password);
  if (h === "#/login") { location.hash = "#/new"; return; }
  await refreshMeta();
  const app = $("#app");
  let m;
  app.innerHTML = shell('<div class="muted">Loading…</div>');
  if ((m = h.match(/^#\/pull\/(\d+)/))) return renderPull(+m[1], true);
  const pages = {"#/new":renderNew,"#/pulls":renderPulls,"#/presets":renderPresets,"#/exclusions":renderExclusions,"#/companies":renderCompanies,
                 "#/credits":renderCredits,"#/settings":renderSettings,"#/accounts":renderAccounts};
  await (pages[h] || renderNew)();
}
window.addEventListener("hashchange", route);
document.addEventListener("click", e => {
  if (e.target.id === "stopAll") {
    if (!confirm("Stop ALL running pulls now? Collecting stops and keeps what's collected; research sends nobody else (people already sent still come back).")) return;
    api("/api/stop-all", {body:{}}).then(r => { toast(`Stopped ${r.stopped} pull(s).`); route(); }).catch(err => toast(err.message, true));
  }
  if (e.target.id === "logout") { e.preventDefault(); api("/api/auth/logout",{body:{}}).then(()=>{location.hash="#/login";route();}); }
});
function setMain(html) { $("#main").innerHTML = html; }

// ------------------------------------------------------------ login
function renderLogin(noPassword) {
  $("#app").innerHTML = `<div class="center-box"><div class="card">
    <h1>Lead Puller</h1>${noPassword ? `<div class="notice warn">No password is set yet. Ask your developer to add <b>APP_PASSWORD</b> to the .env file and restart the app.</div>` :
    `<p class="sub">Log in to continue.</p>
    <form id="lf"><div class="field"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" autofocus></div>
    <button class="btn primary" style="width:100%">Log in</button></form>`}</div></div>`;
  if (noPassword) return;
  $("#lf").onsubmit = async e => {
    e.preventDefault();

function summarize(f) {
  const parts = [];
  if (f.jobTitle) parts.push(f.jobTitle.slice(0,3).join(", ") + (f.jobTitle.length>3?"…":""));
  if (f.seniority) parts.push(f.seniority.join("/"));
  if (f.industry) parts.push(f.industry.slice(0,2).join(", ") + (f.industry.length>2?"…":""));
  if (f.companySize) parts.push(f.companySize.join(", ") + " employees");
  if (f.contactCountry) parts.push(f.contactCountry.join(", "));
  if (f.locations) parts.push(f.locations.slice(0,2).join(", "));
  return parts.join(" · ") || "No filters";
}

// ------------------------------------------------------------ filter editor
// Fixed lists (industry, size, seniority, funding …) are dropdowns of Seamless's own values.
// Places (countries, states, cities, zip codes) are looked up in Seamless's place list as you type (free).
// Job titles, company names, keywords and technologies are free text: Seamless matches them as typed.
function filterEditor(filters, editable) {
  const groups = {};
  META.filters.forEach(f => (groups[f.group] = groups[f.group] || []).push(f));
  let html = "";
  Object.entries(groups).forEach(([g, fs], gi) => {
    const anySet = fs.some(f => filters[f.key] !== undefined);
    const collapsed = !anySet && !["People","Location","Better matches"].includes(g);
    html += `<div class="fgroup"><h3>${esc(g)} ${collapsed && editable ? `<button class="btn small" data-open="${gi}" style="margin-left:6px">Show</button>` : ""}</h3>
      <div class="grid g2 ${collapsed && editable ? "hide" : ""}" data-group="${gi}">`;
    fs.forEach(f => {
      if (!editable && filters[f.key] === undefined) return;
      const badge = f.native ? ' <span class="badge b-brand" title="Seamless excludes these itself, so they cost no credits">Seamless</span>' : "";
      const lab = f.kind === "bool" && editable ? "" : `<label>${esc(f.label)}${badge}</label>`;
      html += `<div class="field" data-key="${f.key}">${lab}${fieldInput(f, filters[f.key], editable)}${f.help && editable ? `<div class="help">${esc(f.help)}</div>`:""}</div>`;
    });
    html += `</div></div>`;
  });
  return html;
}
function fieldInput(f, val, editable) {
  if (f.kind === "bool") {
    if (!editable) return `<div>${val ? "Yes" : "No"}</div>`;
    return `<label class="switch"><input type="checkbox" data-bool ${val?"checked":""}> ${esc(f.label)}</label>`;
  }
  if (f.kind === "int") {
    if (!editable) return `<div>${esc(String(val))}</div>`;
    return `<input type="number" data-int min="${f.min||0}" max="${f.max||100000}" value="${val ?? ""}" placeholder="Not set" style="max-width:200px" aria-label="${esc(f.label)}">`;
  }
  if (f.kind === "choice") {
    const labels = f.option_labels || {};
    if (!editable) return `<div>${esc(labels[String(val)] || String(val))}</div>`;
    const anyLabel = f.default_from_env ? `Default (${esc(labels[META.location_default] || META.location_default)})` : "Any";
    return `<select data-choice aria-label="${esc(f.label)}"><option value="">${anyLabel}</option>${f.options.map(o=>`<option value="${esc(String(o))}" ${String(val)===String(o)?"selected":""}>${esc(labels[String(o)]||String(o))}</option>`).join("")}</select>`;
  }
  const items = val || [];
  const chips = `<div class="chips">${items.map(v=>`<span class="chip">${esc(v)}${editable?`<button data-rm="${esc(v)}" title="Remove">×</button>`:""}</span>`).join("")}</div>`;
  if (!editable) return chips;
  if (f.kind === "enum_list") return chips + `<select data-add aria-label="Add to ${esc(f.label)}"><option value="">+ Add from Seamless's list…</option>${f.options.filter(o=>!items.includes(o)).map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;
  if (f.lookup) return chips + `<input data-text data-lookup="${esc(f.lookup)}" autocomplete="off" placeholder="Start typing a place, then pick it from Seamless's list" aria-label="Add to ${esc(f.label)}">`;
  return chips + `<input data-text placeholder="Type and press Enter (comma for several)" aria-label="Add to ${esc(f.label)}">`;
}
function readFilters(root) {
  const out = {};
  root.querySelectorAll(".field[data-key]").forEach(el => {
    const key = el.dataset.key, f = META.filters.find(x=>x.key===key);
    if (f.kind === "choice") { const v = $("select", el).value; if (v !== "") out[key] = (v==="true"?true:v==="false"?false:v); }
    else if (f.kind === "bool") { if ($("input", el).checked) out[key] = true; }
    else if (f.kind === "int") { const n = parseInt($("input", el).value, 10); if (n > 0) out[key] = n; }
    else { const vals = [...el.querySelectorAll(".chip")].map(c => c.firstChild.textContent); if (vals.length) out[key] = vals; }
  });
  return out;
}
function wireEditor(root, onChange) {
  let lookT, lookSeq = 0;
  const closeSugg = () => $$(".sugg", root).forEach(s => s.remove());
  const addTyped = inp => { inp.value.split(",").map(s=>s.trim()).filter(Boolean).forEach(v => addChip(inp.closest(".field"), v)); inp.value = ""; onChange(); };
  root.addEventListener("click", e => {
    if (e.target.dataset.rm !== undefined) { e.target.closest(".chip").remove(); onChange(); }
    if (e.target.dataset.open !== undefined) { root.querySelector(`[data-group="${e.target.dataset.open}"]`).classList.remove("hide"); e.target.remove(); }
    const pick = e.target.closest("[data-pick]");
    if (pick) { const field = pick.closest(".field"); const neg = field.dataset.key.startsWith("exclude");
      addChip(field, pick.dataset.pick); $("input[data-text]", field).value = ""; closeSugg(); onChange(); $("input[data-text]", field).focus(); void neg; }
  });
  root.addEventListener("change", e => {
    if (e.target.matches("select[data-add]") && e.target.value) {
      addChip(e.target.closest(".field"), e.target.value); e.target.querySelector(`option[value="${CSS.escape(e.target.value)}"]`)?.remove();
      e.target.value = ""; onChange();
    }
    if (e.target.matches("select[data-choice]") || e.target.matches("input[data-bool]") || e.target.matches("input[data-int]")) onChange();
  });
  root.addEventListener("input", e => {
    const inp = e.target; if (!inp.matches("input[data-lookup]")) return;
    clearTimeout(lookT); const q = inp.value.trim(); closeSugg();
    if (q.length < 2) return;
    lookT = setTimeout(async () => {
      const my = ++lookSeq;
      let rows = [];
      try { rows = (await api(`/api/lookup/locations?${qs({q, types: inp.dataset.lookup})}`)).rows; } catch(err) { return; }
      if (my !== lookSeq || inp.value.trim() !== q) return;
      closeSugg();
      const box = document.createElement("div"); box.className = "sugg";
      box.innerHTML = rows.length ? rows.map((r,i) => `<button type="button" data-pick="${esc(r.value)}" class="${i===0?"hl":""}"><span>${esc(r.value)}</span><span class="small muted">${esc(r.type||"")}${r.count!=null?` · ${fmt(r.count)} people`:""}</span></button>`).join("")
        : `<div class="small muted" style="padding:8px 10px">Seamless doesn't know “${esc(q)}”. Check the spelling, or press Enter to use it as typed.</div>`;
      inp.closest(".field").appendChild(box);
    }, 250);
  });
  root.addEventListener("keydown", e => {
    if (!e.target.matches("input[data-text]")) return;
    const box = $(".sugg", e.target.closest(".field"));
    if (box && ["ArrowDown","ArrowUp"].includes(e.key)) {
      e.preventDefault(); const bs = $$("button", box); if (!bs.length) return;
      let i = bs.findIndex(b => b.classList.contains("hl")); bs.forEach(b => b.classList.remove("hl"));
      i = e.key === "ArrowDown" ? Math.min(bs.length-1, i+1) : Math.max(0, i-1); bs[i].classList.add("hl"); bs[i].scrollIntoView({block:"nearest"}); return;
    }
    if (e.key === "Escape") { closeSugg(); return; }
    if (e.key === "Enter") {
      e.preventDefault();
      const hl = box && $("button.hl", box);
      if (hl) { addChip(e.target.closest(".field"), hl.dataset.pick); e.target.value = ""; closeSugg(); onChange(); return; }
      closeSugg(); addTyped(e.target);
    }
  });
  root.addEventListener("focusout", e => {
    if (!e.target.matches("input[data-text]")) return;
    setTimeout(() => {           // let a click on a suggestion land first
      if (!e.target.isConnected) return;
      if (e.target.matches("[data-lookup]")) { if (!root.contains(document.activeElement) || !document.activeElement.closest(".sugg")) closeSugg(); return; }
      if (e.target.value.trim()) addTyped(e.target);
    }, 200);
  });
}
function addChip(field, v) {
  const chips = $(".chips", field);
  if ([...chips.querySelectorAll(".chip")].some(c => c.firstChild.textContent === v)) return;
  const f = META.filters.find(x=>x.key===field.dataset.key);
  if (chips.children.length >= (f.max||100)) return toast(`${f.label}: up to ${f.max} values.`, true);
  const s = document.createElement("span"); s.className = "chip"; s.append(document.createTextNode(v));
  const b = document.createElement("button"); b.dataset.rm = v; b.title = "Remove"; b.textContent = "×"; s.append(b);
  chips.append(s);
}

// ------------------------------------------------------------ pull page
const STEP_OF = {draft:0, previewed:1, collecting:2, collected:3, researching:4, paused:-1, done:5, cancelled:3, failed:-1};
const STEP_NAMES = ["Filters","Preview","Collect","Choose","Research","Results"];
const STATUS_BADGE = {draft:["Filters","b-brand"],previewed:["Previewed","b-brand"],collecting:["Collecting","b-warn"],collected:["Ready to research","b-brand"],
  researching:["Researching","b-warn"],paused:["Paused","b-bad"],done:["Done","b-ok"],cancelled:["Stopped",""],failed:["Failed","b-bad"]};
const phaseOf = p => p.status === "paused" ? p.paused_from : p.status;

async function renderPull(id, fresh) {
  let p;
  try { p = await api("/api/pulls/" + id); } catch(e) { return setMain(`<div class="notice bad">${esc(e.message)}</div>`); }
  // While research or collecting refreshes this screen, keep the tables (and your place in them) as they are.
  const prev = CURRENT_PULL;
  CURRENT_PULL = p;
  refreshChrome(p.credits);
  const phase = phaseOf(p);
  if (!fresh && prev && prev.id === id && prev.status === p.status && $("#pullBody") && ["collecting","researching"].includes(phase)) {
    updateLive(p); schedulePoll(p); return;
  }
  const step = STEP_OF[phase] ?? -1;
  const [bl, bc] = STATUS_BADGE[p.status] || [p.status, ""];
  let body = "";
  if (p.status === "draft") body = stageDraft(p);
  else if (p.status === "previewed") body = stagePreview(p);
  else if (phase === "collecting") body = stageCollecting(p);
  else if (p.status === "collected") body = stageChoose(p);
  else if (phase === "researching") body = stageResearching(p);
  else if (p.status === "done") body = stageDone(p);
  else if (p.status === "cancelled") body = stageCancelled(p);
  const researched = p.stats.submitted > 0;
  const canBack = ["previewed","collected"].includes(p.status) || (p.status === "paused" && phase === "collecting");
  setMain(`<div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><input class="name-input" id="pname" value="${esc(p.name)}" aria-label="Pull name">
      <div class="row small muted" style="gap:8px;margin-top:2px"><span class="badge ${bc}">${bl}</span> Pull #${p.id} · ${when(p.created_at)}
        · <span id="hdrCredits">${fmt(p.search_credits + p.research_credits)} credits used (${fmt(p.search_credits)} search, ${fmt(p.research_credits)} research)</span>
        ${p.account ? ` · Seamless account: <b>${esc(p.account.name)}</b>` : ""}
        ${p.cloned_from ? ` · ${p.edited_from ? "edited copy" : "re-run"} of <a href="#/pull/${p.cloned_from}">#${p.cloned_from}</a>` : ""}
        ${p.moved_to ? ` · continued in <a href="#/pull/${p.moved_to}">#${p.moved_to}</a>` : ""}</div></div>
      <div class="row">
        ${canBack ? `<button class="btn small" id="editFilters" title="Back to the filters. The collected list is cleared.">Edit filters</button>` : ""}
        ${researched || ["done","cancelled"].includes(p.status) || phase === "researching" ? `<button class="btn small" id="editCopy" title="A new pull with the same filters for you to change. People you've already paid for stay skipped.">Edit filters (new copy)</button>` : ""}
        <button class="btn small" id="rerun" title="Same filters, only people you've never pulled">Run again, new people only</button>
        ${["collecting","researching"].includes(p.status) ? "" : `<button class="btn small danger" id="del">Delete</button>`}</div></div>
    <div class="steps">${STEP_NAMES.map((n,i)=>`<span class="${i===step?"on":i<step?"done":""}">${i+1}. ${n}</span>`).join("")}</div>
    <div id="pauseBox">${pauseBox(p)}</div>
    <div id="pullBody">${body}</div>`);
  $("#pname").onchange = e => api("/api/pulls/" + id, {method:"PATCH", body:{name:e.target.value}}).then(()=>toast("Renamed.")).catch(err=>toast(err.message,true));
  $("#rerun").onclick = e => busy(e.currentTarget, async () => { const n = await api(`/api/pulls/${id}/rerun`, {body:{}}); location.hash = "#/pull/" + n.id; });
  $("#editCopy") && ($("#editCopy").onclick = e => busy(e.currentTarget, async () => { const n = await api(`/api/pulls/${id}/edit-copy`, {body:{}});
    toast("New copy with the same filters. People you've already paid for stay skipped."); location.hash = "#/pull/" + n.id; }));
  $("#editFilters") && ($("#editFilters").onclick = e => {
    const n = p.stats.kept;
    if (n && !confirm(`Go back to the filters? The ${fmt(n)} people collected so far are cleared (the ${fmt(p.search_credits)} search credits already spent aren't refunded). You'll preview again after changing the filters.`)) return;
    busy(e.currentTarget, async () => { await api(`/api/pulls/${id}/back-to-filters`, {body:{}}); renderPull(id, true); });
  });
  $("#del") && ($("#del").onclick = async () => {
    if (!confirm("Delete this pull and its results? People you already paid for stay on the already-pulled list, so they are still skipped in future pulls.")) return;
    try { await api("/api/pulls/" + id, {method:"DELETE"}); location.hash = "#/pulls"; } catch(e) { toast(e.message, true); }
  });
  wirePause(p);
  wirePull(p);
  schedulePoll(p);
}
function schedulePoll(p) {
  const live = ["collecting","researching"].includes(p.status);
  if (live && !POLL) POLL = setInterval(() => {
    if (CURRENT_PULL && location.hash === "#/pull/" + CURRENT_PULL.id) renderPull(CURRENT_PULL.id); else { clearInterval(POLL); POLL = null; }
  }, 2500);
  if (!live && POLL) { clearInterval(POLL); POLL = null; }
}
function pauseBox(p) {
  if (p.status !== "paused") return p.error ? `<div class="notice warn">${esc(p.error)}</div>` : "";
  if (p.test_state === "failed" && phaseOf(p) === "researching") return `<div class="notice bad"><b>${esc(p.error || "Paused.")}</b></div>`;
  const k = p.pause_kind, moves = p.move_to || [];
  let btns = "";
  if (k === "low_keep" || k === "cap") btns = `<button class="btn primary small" id="resume">Keep collecting</button><button class="btn small danger" id="cancel">Stop and keep what's collected</button><button class="btn small" id="editFilters2">Change the filters</button>`;
  else if (k === "account") btns = moves.map(a => `<button class="btn primary small" data-move="${a.id}">Continue with ${esc(a.name)} (${fmt(a.usable)} credits to spare)</button>`).join("") +
      `<button class="btn small" id="resume">Try ${esc(p.account ? p.account.name : "this account")} again</button><button class="btn small danger" id="cancel">Stop</button>`;
  else btns = `<button class="btn primary small" id="resume">Resume</button><button class="btn small danger" id="cancel">Stop</button>`;
  const more = k === "account" ? (moves.length ? `<div class="small" style="margin-top:6px">“Continue with …” keeps everyone already researched here and starts a new pull with the same filters on the other account (a short preview, about 3 credits). Nobody you've paid for, on either account, comes back.</div>`
      : `<div class="small" style="margin-top:6px">No other account has credits to spare. Add or switch one on in <a href="#/accounts">Seamless accounts</a>, or raise the budget in .env.</div>`) : "";
  return `<div class="notice bad"><b>${esc(p.error || "Paused.")}</b>${more}<div class="row" style="margin-top:8px">${btns}</div></div>`;
}
function wirePause(p) {
  const id = p.id;
  $("#resume") && ($("#resume").onclick = e => busy(e.currentTarget, async () => { await api(`/api/pulls/${id}/resume`, {body:{}}); renderPull(id, true); }));
  $("#cancel") && ($("#cancel").onclick = e => busy(e.currentTarget, async () => { await api(`/api/pulls/${id}/cancel`, {body:{}}); renderPull(id, true); }));
  $("#editFilters2") && ($("#editFilters2").onclick = e => { $("#editFilters") ? $("#editFilters").click() : null; });
  $$("[data-move]").forEach(b => b.onclick = () => {
    if (!confirm(`Continue on ${b.textContent.replace(/^Continue with /,"").replace(/ \(.*/,"")}? Everyone already researched stays here. A new pull with the same filters starts on that account (about 3 credits for its preview). Anyone already paid for on either account is skipped.`)) return;
    busy(b, async () => { const n = await api(`/api/pulls/${id}/move-account`, {body:{account_id:+b.dataset.move}}); location.hash = "#/pull/" + n.id; });
  });
}

          <option value="auto" ${(p.account_choice||"auto")==="auto"?"selected":""}>Automatic: first account with credits to spare</option>
          ${opts.map(a=>`<option value="${a.id}" ${String(p.account_choice)===String(a.id)?"selected":""}>${esc(a.name)} (${a.usable==null?"balance not checked":fmt(a.usable)+" to spare"})</option>`).join("")}</select>
        <div class="help">The whole pull uses one account. People already pulled on any account are skipped. Manage keys in <a href="#/accounts">Seamless accounts</a>.</div></div></div></div>
    <div class="row" style="justify-content:space-between"><div class="row"><input id="presetName" placeholder="Preset name" style="width:200px" aria-label="Preset name"><button class="btn" id="savePreset">Save as preset</button></div>
      <button class="btn primary" id="previewBtn">Preview — about ${Math.ceil(META.defaults.preview_size/10)} credits</button></div>`;
}

// ---- 2. preview
function stagePreview(p) {
  const s = p.stats, fit = s.fit || {};
  return `${p.started_from ? `<div class="notice info">${esc(p.started_from)} ${p.started_from.startsWith("Same search") ? `<button class="btn small" id="fromTop" style="margin-left:6px">Start from the top instead</button>` : ""}</div>` : ""}
    <div class="grid g4" style="margin-bottom:16px">
      <div class="stat"><div class="k">Matching people in Seamless</div><div class="v">${fmt(p.total_matches)}</div><div class="h">for these filters (before skips)</div></div>
      <div class="stat"><div class="k">Sample checked</div><div class="v">${fmt(s.seen)}</div><div class="h">${fmt(s.kept)} kept · ${fmt(s.skipped)} skipped</div></div>
      <div class="stat"><div class="k">Fit in sample</div><div class="v">${fmt(fit.high||0)} <span class="small muted">good</span></div><div class="h">${fmt(fit.medium||0)} maybe · ${fmt(fit.low||0)} poor${fit.unrated?` · ${fmt(fit.unrated)} unrated`:""}</div></div>
      <div class="stat"><div class="k">Credits spent so far</div><div class="v">${fmt(p.search_credits)}</div><div class="h">${p.account?esc(p.account.name)+": ":""}balance ${fmt(p.account?p.account.balance:p.credits.balance)}</div></div></div>
    ${(fit.low||0) > (s.kept/3) ? `<div class="notice warn">A lot of the sample is a poor fit. Consider tightening the filters before collecting.</div>` : ""}
    ${s.seen === 0 ? `<div class="notice warn">No one matched. Loosen the filters (fewer titles, wider size range, or check the locations).</div>` : ""}
    <div class="card"><h2>Collect the list</h2>
      <div class="grid g3"><div class="field"><label for="target">How many people</label><input type="number" id="target" min="1" value="${p.target || Math.min(p.total_matches||100, 500)}"></div>
      <div class="field"><label for="cap">Max people per company</label><input type="number" id="cap" min="0" value="${p.per_company_cap}"><div class="help">0 = no limit</div></div>
      <div></div></div>
      <div id="estBox" class="notice info small">Working out the cost…</div>
      <div class="row" style="justify-content:flex-end"><button class="btn primary" id="collectBtn">Collect list</button></div></div>
    ${skipCard(p)}
    <div class="card"><h2>Sample</h2><div id="sampleTable"></div></div>
    <div class="grid g2">${breakdown("Country (sample)", s.by_country, "country")}${breakdown("Company size (sample)", s.by_size, "size")}</div>`;
}
function estHtml(e) {
  if (e.search_credits == null) return `<b>Can't estimate yet:</b> nobody in the sample was kept, so there's no keep rate to go on. Loosen the filters before collecting.`;
  let h = `<div style="font-size:14px"><b>Estimated cost: about ${fmt(e.total)} credits</b> — ${fmt(e.search_credits)} to search (keeping about ${e.keep_rate}% of the people Seamless shows) + ${fmt(e.research_credits)} to research them later.</div>
    <div style="margin-top:4px">Collecting stops by itself when it's close to your target, pauses and asks if most people are being skipped, and never spends more than <b>${fmt(e.cap)}</b> search credits without asking you (COLLECT_SPEND_CAP_PCT in .env).</div>`;
  if (e.short) h += `<div style="margin-top:6px;color:var(--bad)"><b>${esc(e.account)} only has ${fmt(e.usable)} credits to spare.</b> ${e.others.length ? `${esc(e.others.map(o=>o.name).join(", "))} ${e.others.length>1?"have":"has"} enough: choose it under “Edit filters → Seamless account”, or the pull pauses and offers to continue there.` : "Lower the number, top up, or add another account."}</div>`;
  return h;
}
function breakdown(title, rows, key) {
  const total = rows.reduce((a,r)=>a+r.n,0) || 1;
  return `<div class="card"><h3>${title}</h3>${rows.length ? rows.map(r=>`<div class="row small" style="gap:8px;margin-bottom:6px"><div style="width:140px" class="nowrap">${esc(r[key])}</div><div class="bar" style="flex:1"><i style="width:${(r.n/total*100).toFixed(0)}%"></i></div><div style="width:40px" class="right">${fmt(r.n)}</div></div>`).join("") : '<div class="muted small">No data</div>'}</div>`;
}

// ---- skip report (what each skip reason cost)
function skipCard(p) {
  const r = p.stats.skip_reasons || [];
  if (!r.length) return "";
  const total = r.reduce((a,x)=>a+x.credits,0);
  return `<div class="card" id="skipCard"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Why people were skipped</h2>
      <span class="small muted">${fmt(p.stats.skipped)} skipped · about ${fmt(Math.round(total))} search credits spent showing them</span></div>
    <div class="small muted" style="margin:4px 0 8px">Seamless charges 1 credit per 10 people it shows, including people this tool then skips. Click a reason to see who.</div>
    <div class="skiprow small muted" style="font-weight:600"><span>Reason · what to change</span><span class="right">People</span><span class="right">Credits</span></div>
    ${r.map(x=>`<div class="skiprow"><div><button class="linkbtn" data-skipkind="${esc(x.kind)}">${esc(x.label)}</button>${x.tip?`<div class="small muted">${esc(x.tip)}</div>`:""}</div>
      <div class="right"><b>${fmt(x.n)}</b></div><div class="right">≈ ${fmt(Math.round(x.credits))}</div></div>`).join("")}
    <div id="skipPeople" class="hide" style="margin-top:12px"><div class="row" style="justify-content:space-between"><h3 id="skipTitle" style="margin:0"></h3><button class="btn small" id="skipClose">Close</button></div><div id="skipTable" style="margin-top:8px"></div></div></div>`;
}
function wireSkips(p) {
  $$("[data-skipkind]").forEach(b => b.onclick = () => {
    const kind = b.dataset.skipkind;
    $("#skipPeople").classList.remove("hide"); $("#skipTitle").textContent = "Skipped: " + b.textContent;
    pagedTable($("#skipTable"), `skip.${p.id}.${kind}`, {reset:true, placeholder:"Search name, company or title",
      url: s => `/api/pulls/${p.id}/contacts?${qs({view:"skipped", kind, ...s})}`, sort:"name", dir:"asc",
      cols: [{label:"Name", sort:"name", html: nameCell}, {label:"Title", sort:"title", html: r=>esc(r.title)},
             {label:"Company", sort:"company", html: companyCell}, {label:"Country", sort:"country", html: r=>esc(r.country)},
             {label:"Reason", html: r=>`<span class="small">${esc(r.skip_reason)}</span>`}]});
  });
  $("#skipClose") && ($("#skipClose").onclick = () => $("#skipPeople").classList.add("hide"));
}

// ---- 3. collecting
function stageCollecting(p) {
  return `<div class="card" id="liveCard">${collectingInner(p)}</div><div id="skipWrap">${skipCard(p)}</div>`;
}
function collectingInner(p) {
  const s = p.stats, pct = p.target ? Math.min(100, s.kept / p.target * 100) : 0;
  const est = p.est_search_credits, spent = (p.search_credits||0) - (p.collect_started_credits||0);
  return `<h2>${p.status==="paused"?"Collecting paused":"Collecting the list…"}</h2>
    <div class="bar" style="margin:10px 0"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="row" style="justify-content:space-between"><div><b>${fmt(s.kept)}</b> of ${fmt(p.target)} people · ${fmt(s.skipped)} skipped · ${fmt(p.pages_fetched)} pages · ${fmt(p.search_credits)} search credits
      ${est!=null?`<div class="small muted">This run: ${fmt(spent)} of about ${fmt(est)} estimated · asks you before going past ${fmt((p.spend_cap||0)-(p.collect_started_credits||0))}</div>`:""}</div>
    ${p.status==="collecting" ? `<div class="row"><button class="btn small" id="pauseBtn">Pause</button><button class="btn small danger" id="stopBtn">Stop collecting (keep what's collected)</button></div>`:""}</div>
    <div class="small muted" style="margin-top:8px">This runs on the server. You can close this page and come back.</div>`;
}

// ---- 4. choose
function stageChoose(p) {
  const s = p.stats, fit = s.fit || {};
  const rated = (fit.high||0)+(fit.medium||0)+(fit.low||0);
  const opts = [["all", "Everyone ticked"], ["high_medium", "Good + maybe fit"], ["high", "Good fit only"],
    ["chance", "Only people with email chance ≥"], ["first_n", "Only the first…"]];
  const d = META.defaults, a = p.account;
  const def = rated ? "high_medium" : "all";
  return `${p.stop_reason ? `<div class="notice info">${esc(p.stop_reason)}</div>` : ""}
    <div class="grid g4" style="margin-bottom:16px">
      <div class="stat"><div class="k">People collected</div><div class="v">${fmt(s.kept)}</div><div class="h">${fmt(s.skipped)} skipped</div></div>
      <div class="stat"><div class="k">Good fit</div><div class="v">${fmt(fit.high||0)}</div><div class="h">${fmt(fit.medium||0)} maybe · ${fmt(fit.low||0)} poor</div></div>
      <div class="stat"><div class="k">${a?esc(a.name):"Seamless"} balance</div><div class="v">${fmt(a?a.balance:p.credits.balance)}</div><div class="h">${a&&a.usable!=null?`${fmt(a.usable)} to spare (reserve + budget)`:"no limit set"}</div></div>
      <div class="stat"><div class="k">Search credits used</div><div class="v">${fmt(p.search_credits)}</div><div class="h">${fmt(p.pages_fetched)} pages</div></div></div>
    <div class="card"><h2>Who should get emails and phones?</h2>
      <p class="small muted" style="margin-top:-6px">Research costs 1 credit per person sent, whether or not Seamless finds an email. ${rated ? "" : "Fit wasn't rated (no Claude key or fit check off)."}</p>
      ${opts.map(([v,l])=>`<label class="radio ${v===def?"on":""}"><input type="radio" name="choice" value="${v}" ${v===def?"checked":""}><div><b>${l}</b>${v==="first_n"?` <input type="number" id="firstN" min="1" value="${Math.min(100,s.kept)}" style="width:110px;display:inline-block;margin-left:6px" aria-label="How many">`:""}${v==="chance"?` <input type="number" id="chanceMin" min="0" max="100" value="${d.chance_min}" style="width:80px;display:inline-block;margin-left:6px" aria-label="Minimum email chance" ${s.chance_known?"":"disabled"}> %
        <div class="small muted">${s.chance_known?`Known for ${fmt(s.chance_known)} of ${fmt(s.kept)} people, from people of the same country (and size / LinkedIn where there's enough history) you researched before. People without enough history show “—” and are not included.`:`Not enough history yet: it needs ${fmt(META.defaults.chance_samples||30)} people researched from the same country first.`}</div>`:""}</div></label>`).join("")}
      ${d.test_batch_size && s.selected > d.test_batch_size && !s.submitted ? `<div class="notice info" style="margin-top:10px"><b>Test batch:</b> the first ${fmt(d.test_batch_size)} people are researched first. If fewer than ${d.test_batch_min_rate}% of them have an email, it pauses so you can continue or stop before spending the rest.</div>` : ""}
      ${s.retries ? `<div class="notice warn" style="margin-top:10px">${fmt(s.retries)} of these were pulled before with no email and are being retried (NO_EMAIL_RETRY_DAYS). Each retry costs 1 credit again, unless their email is found free in your Seamless saved contacts first.</div>` : ""}
      <div id="roomBox"></div>
      <div class="row" style="justify-content:space-between;margin-top:12px"><div id="costLine" style="font-weight:600"><span class="spin"></span></div>
      <div class="row"><button class="btn" id="moreBtn">Collect more</button><button class="btn primary" id="researchBtn" disabled>Get emails & phones</button></div></div>
      <div class="small muted" style="margin-top:8px">Untick people in the list below to leave them out. The count above always covers every page, not just the one you're looking at.</div></div>
    <div class="card"><h2>Collected list</h2><div id="chooseTable"></div></div>
    ${skipCard(p)}`;
}
const FITB = {high:["Good","b-ok"],medium:["Maybe","b-warn"],low:["Poor","b-bad"]};
const nameCell = r => `<span class="nowrap">${r.li_url?`<a href="${esc(r.li_url.startsWith("http")?r.li_url:"https://"+r.li_url)}" target="_blank" rel="noopener">${esc(r.name)}</a>`:esc(r.name)}</span>`;
const companyCell = r => `${esc(r.company)}<div class="small muted">${esc(r.domain)}${r.size?` · ${esc(r.size)}`:""}</div>`;
const fitCell = r => { const [fl,fc] = FITB[r.fit]||["—",""]; return `<span class="badge ${fc}">${fl}</span>${r.fit_reason?`<div class="small muted">${esc(r.fit_reason)}</div>`:""}`; };
const chanceCell = r => (r.email_chance==null ? '<span class="muted" title="Not enough history for this kind of person yet">—</span>'
  : `<span class="badge ${r.email_chance>=70?"b-ok":r.email_chance>=40?"b-warn":"b-bad"}" title="${esc(r.email_chance_basis||"")}">${Math.round(r.email_chance)}%</span>${r.email_chance_basis?`<div class="small muted">${esc(r.email_chance_basis)}</div>`:""}`)
  + (r.retry?'<div class="small muted">retry (charged again)</div>':"");

// ---- 5. research
function stageResearching(p) {
  return `<div id="liveTop">${researchTop(p)}</div><div class="card" id="liveCard">${researchingInner(p)}</div>
    ${p.stats.with_email ? `<div class="notice info small">You can already download the people who have come back. Each download is recorded, so nobody is ever given to you twice.</div>${downloadSection(p)}` : ""}`;
}
function researchTop(p) {
  return `${p.stop_reason ? `<div class="notice info">${esc(p.stop_reason)}</div>` : ""}
    ${p.test_state==="running" ? `<div class="notice info"><b>Test batch running:</b> researching the first ${fmt(p.test_size)} people. If fewer than ${META.defaults.test_batch_min_rate}% have an email, it pauses before spending more.</div>`:""}
    ${p.test_state==="failed" ? `<div class="row" style="margin:-4px 0 14px;gap:8px"><button class="btn primary" id="continueTest">Continue anyway</button><button class="btn danger" id="stopTest">Stop: spend nothing more</button></div>`:""}
    ${p.test_state==="passed" ? `<div class="notice info">Test batch passed: ${Math.round(p.test_rate)}% had an email. Carrying on with everyone else.</div>`:""}`;
}
function researchingInner(p) {
  const s = p.stats, total = s.selected || s.submitted || 1, done = s.submitted - s.pending, pct = Math.min(100, done / total * 100);
  const wait = META.defaults.wait_minutes, oldest = s.oldest_pending_at;
  const until = oldest ? oldest + wait * 60 : null;
  const onlyWaiting = s.pending && !s.to_research;
  return `<h2>${p.status==="paused"?"Research paused":"Getting emails and phones…"}</h2>
    <div class="bar" style="margin:10px 0"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="row" style="justify-content:space-between"><div><b>${fmt(done)}</b> of ${fmt(s.selected || s.submitted)} done · ${fmt(s.with_email)} with email · ${fmt(s.pending)} waiting on Seamless · ${fmt(s.to_research)} not sent yet · ${fmt(p.research_credits)} research credits</div>
    ${p.status==="researching" ? `<div class="row"><button class="btn small" id="pauseBtn">Pause</button>${s.to_research?`<button class="btn small danger" id="stopBtn">Stop: send nobody else</button>`:""}</div>`:""}</div>
    ${onlyWaiting ? `<div class="notice warn" style="margin:12px 0 0"><b>${plural(s.pending, "person", "people")} still waiting on Seamless.</b> The tool waits up to ${fmt(wait)} minutes (RESEARCH_WAIT_MINUTES in .env)${until?`, until about ${clock(until)}`:""}, then finishes without them.
        <div class="row" style="margin-top:8px"><button class="btn primary small" id="finishNow">Finish now without them</button><span class="small muted">You've already paid for them. If Seamless answers in the next ${fmt(META.defaults.late_hours)} hours, they're filled in free.</span></div></div>` : ""}
    <div class="small muted" style="margin-top:8px">This runs on the server. You can close this page and come back.</div>`;
}
function updateLive(p) {
  const phase = phaseOf(p);
  $("#hdrCredits") && ($("#hdrCredits").textContent = `${fmt(p.search_credits + p.research_credits)} credits used (${fmt(p.search_credits)} search, ${fmt(p.research_credits)} research)`);
  $("#pauseBox").innerHTML = pauseBox(p); wirePause(p);
  if (phase === "collecting") { $("#liveCard").innerHTML = collectingInner(p);
    if (!$("#skipPeople") || $("#skipPeople").classList.contains("hide")) { $("#skipWrap").innerHTML = skipCard(p); wireSkips(p); } }
  if (phase === "researching") {
    $("#liveCard").innerHTML = researchingInner(p); $("#liveTop").innerHTML = researchTop(p);
    if (p.stats.with_email && !$("#dlSection")) { renderPull(p.id, true); return; }
    if ($("#dlSection")) updateDownloadNumbers(p);
  }
  wireLive(p);
}

// ---- 6. results
function stageCancelled(p) {
  return `${p.stop_reason ? `<div class="notice info">${esc(p.stop_reason)}</div>` : ""}
    ${p.stats.submitted ? stageDone(p) : `<div class="card muted">This pull was stopped before research. Use “Edit filters (new copy)” or “Run again” to start over.</div>${skipCard(p)}`}`;
}
function stageDone(p) {
  const s = p.stats, rate = s.submitted ? Math.round(s.with_email / s.submitted * 100) : 0;
  const d = META.defaults, cc = s.charge_check;
  return `${p.stop_reason && p.status==="done" ? `<div class="notice info">${esc(p.stop_reason)}</div>` : ""}
    <div class="grid g4" style="margin-bottom:16px">
      <div class="stat"><div class="k">Researched</div><div class="v">${fmt(s.submitted)}</div><div class="h">people</div></div>
      <div class="stat"><div class="k">With email</div><div class="v">${fmt(s.with_email)}</div><div class="h">${rate}% hit rate</div></div>
      <div class="stat"><div class="k">Already downloaded</div><div class="v" id="stDownloaded">${fmt(s.downloaded)}</div><div class="h">from this pull</div></div>
      <div class="stat"><div class="k">Left to download</div><div class="v" style="color:var(--brand)" id="stLeft">${fmt(s.left_to_download)}</div><div class="h">${fmt(s.left_to_download_valid)} with a valid email</div></div></div>
    ${s.late_waiting ? `<div class="notice info"><b>${plural(s.late_waiting, "late answer")} still being watched.</b> If Seamless answers in the next ${fmt(d.late_hours)} hours (LATE_ANSWER_HOURS in .env), the email is filled in here free and shows up in your next batch.</div>` : ""}
    ${cc ? `<div class="notice ${cc.code==="free"?"info":"warn"}"><b>Charge check:</b> ${esc(cc.verdict)} <span class="small muted">(${p.account?esc(p.account.name)+" ":""}balance ${fmt(cc.before)} → ${fmt(cc.after)}; ${fmt(cc.sent)} sent, ${fmt(cc.with_email)} with email)</span></div>` : ""}
    ${s.dup_missing || s.timed_out ? `<div class="notice warn">${s.dup_missing?`<b>${fmt(s.dup_missing)} people were already researched in Seamless before</b>, so Seamless didn't return their details here (and normally didn't charge). `:""}${s.timed_out?`<b>${fmt(s.timed_out)} people got no answer from Seamless in time.</b> `:""}
      <div class="row" style="margin-top:8px"><button class="btn primary small" id="fillSaved">Fill them in from Seamless saved contacts (free)</button><button class="btn small danger hide" id="fillStop">Stop</button>
      <span class="small muted">Reads the saved contacts of every Seamless account. Matches only the exact LinkedIn profile, or exact name + company with a single match.</span></div></div>` : ""}
    ${downloadSection(p)}
    <div class="grid g2">
      <section class="card"><h2>People without email</h2>
        <div style="margin-bottom:10px"><b>${fmt(s.no_email)}</b> people · ${fmt(s.no_email_li)} with LinkedIn · ${fmt(s.no_email_phone)} with a phone</div>
        <a class="btn" href="/api/pulls/${p.id}/export?format=no_email" ${s.no_email?"":'aria-disabled="true"'}>Download for LinkedIn / calling</a>
        <div class="small muted" style="margin-top:8px">They are never pulled again${d.retry_days?` until ${d.retry_days} days have passed (NO_EMAIL_RETRY_DAYS)`:""}, on any account. Their companies are not put on cooldown.</div></section>
      <section class="card"><h2>Everything Seamless returned</h2>
        <div class="row"><button class="btn" id="dlFullX">Excel</button><button class="btn" id="dlFullC">CSV</button><button class="btn small" id="pickFull">Choose columns…</button></div>
        <div id="fullPicker" class="hide" style="margin-top:12px">${columnPicker("f", META.columns.map(c=>c.key), [], false)}</div>
        <div class="small muted" style="margin-top:8px">All researched people, about ${META.columns.length} columns. Not recorded as a batch: for AnavMail use “Download next batch”. ${s.skipped_no_server?`${fmt(s.skipped_no_server)} people skipped before paying: their company domain can't receive email.`:""}</div></section>
    </div>
    <div class="grid g2">${hitRateCard(s)}<div class="card"><h3>What Seamless returned</h3><div class="tablewrap"><table><tbody>
      ${s.research_outcomes.map(r=>`<tr><td>${esc(friendly(r.status))}</td><td class="right"><b>${fmt(r.n)}</b></td></tr>`).join("")}</tbody></table></div></div></div>
    <div class="card"><h2>Researched people</h2><div class="tabs" id="resTabs">${[["results","All"],["not_downloaded","Not downloaded yet"],["downloaded","Downloaded"],["no_email","No email"]].map(([v,l])=>`<button data-v="${v}">${l}</button>`).join("")}</div><div id="resTable"></div></div>
    ${skipCard(p)}`;
}
function downloadSection(p) {
  const s = p.stats, d = META.defaults;
  return `<section class="card" id="dlSection" style="border:2px solid var(--brand)"><h2>Download for AnavMail</h2>
      <div class="row" style="align-items:flex-end;gap:12px">
        <div class="field" style="margin:0"><label for="howMany">How many</label><input type="number" id="howMany" min="1" value="${Math.min(d.batch_size, s.left_to_download)||""}" style="width:130px"></div>
        <div class="row" style="gap:6px"><button class="btn small" data-n="500">500</button><button class="btn small" data-n="1000">1,000</button><button class="btn small" data-n="all" id="allLeft">All ${fmt(s.left_to_download)} left</button></div>
        <div class="field" style="margin:0"><label for="split">Files</label><select id="split" style="width:auto"><option value="one">One file</option><option value="country">One file per country (zip)</option></select></div>
        <label class="switch small"><input type="checkbox" id="risky" checked> Include “risky” emails (MillionVerifier checks them)</label>
        <button class="btn primary" id="dlBatch" style="margin-left:auto" ${s.left_to_download?"":"disabled"}>Download next batch</button>
      </div>
      <div class="small muted" style="margin-top:8px">Only people never downloaded before, from any pull and any Seamless account. Invalid emails and anything on your do-not-pull list are left out. One email per person (the best one Seamless found).</div>
      <div style="margin-top:14px">${columnPicker("b", d.columns, [], true)}</div>
      <h3 style="margin-top:16px">Past batches</h3><div id="batchTable"></div>
    </section>`;
}
function updateDownloadNumbers(p) {
  const s = p.stats;
  $("#allLeft") && ($("#allLeft").textContent = `All ${fmt(s.left_to_download)} left`);

}

const LS_COLS = "lp.cols.";
function columnPicker(id, defaults, sets, needEmail) {
  const chosen = lsGet(LS_COLS + id, defaults).filter(k => META.columns.some(c => c.key === k));

        ${chosen.map(k => orderItem(k, needEmail)).join("")}</ol></div>

      </div></div></div>`;
}
function orderItem(k, needEmail) {
  const c = META.columns.find(x => x.key === k) || {label:k};
  return `<li data-k="${k}" style="padding:2px 0"><span>${esc(c.label)}</span> <span class="muted small">${k}</span>
    <button class="btn small" data-up title="Move up" aria-label="Move ${esc(c.label)} up" style="padding:0 8px">↑</button><button class="btn small" data-down title="Move down" aria-label="Move ${esc(c.label)} down" style="padding:0 8px">↓</button>${needEmail&&k==="email"?"":`<button class="btn small" data-x aria-label="Remove ${esc(c.label)}" style="padding:0 8px">×</button>`}</li>`;
}
function pickerColumns(id) { return $$(`[data-picker="${id}"] [data-order] li`).map(li => li.dataset.k); }
function wirePicker(id, sets) {
  const root = document.querySelector(`[data-picker="${id}"]`); if (!root || root.dataset.wired) return;
  root.dataset.wired = 1;
  const needEmail = root.dataset.needEmail === "1";
  const ol = root.querySelector("[data-order]");
  const sel = $(`#${id}Set`);
  sel.innerHTML = `<option value="">Saved column sets…</option>${sets.map(x=>`<option value="${x.id}">${esc(x.name)} (${x.columns.length})</option>`).join("")}<option value="__default">Default from .env</option>`;
  const sync = () => {
    const cols = pickerColumns(id);
    root.querySelectorAll("[data-col]").forEach(cb => cb.checked = cols.includes(cb.dataset.col));
    root.querySelector("[data-count]").textContent = `${cols.length} column${cols.length===1?"":"s"}`;
    lsSet(LS_COLS + id, cols);
  };
  const setCols = cols => { if (needEmail && !cols.includes("email")) cols = ["email", ...cols]; ol.innerHTML = cols.map(k => orderItem(k, needEmail)).join(""); sync(); };
  root.addEventListener("change", e => {
    if (e.target.dataset.col) { const cols = pickerColumns(id); const k = e.target.dataset.col;
      setCols(e.target.checked ? [...cols, k] : cols.filter(x => x !== k)); }
    if (e.target === sel && sel.value) {
      const v = sel.value; setCols(v === "__default" ? [...META.defaults.columns] : [...(sets.find(x => String(x.id) === v)?.columns || [])]);
      sel.value = ""; }
  });
  root.addEventListener("click", async e => {
    const li = e.target.closest("li");
    if (e.target.dataset.up !== undefined && li.previousElementSibling) { li.parentNode.insertBefore(li, li.previousElementSibling); sync(); }
    if (e.target.dataset.down !== undefined && li.nextElementSibling) { li.parentNode.insertBefore(li.nextElementSibling, li); sync(); }
    if (e.target.dataset.x !== undefined) { li.remove(); sync(); }
    if (e.target.dataset.saveSet !== undefined) {
      const name = $(`#${id}SetName`).value.trim(); if (!name) return toast("Type a name for this column set.", true);
      try { const r = await api("/api/column-sets", {body:{name, columns: pickerColumns(id)}}); toast("Column set saved.");
        sets.splice(0, sets.length, ...r.rows);
        $$("[data-picker] select[id$=Set]").forEach(s => s.innerHTML = `<option value="">Saved column sets…</option>${sets.map(x=>`<option value="${x.id}">${esc(x.name)} (${x.columns.length})</option>`).join("")}<option value="__default">Default from .env</option>`);
      } catch(err) { toast(err.message, true); }
    }
  });
  sync();
}

function wireChoose(p) {

  host.addEventListener("change", e => {

      bar.onclick = ev => { const sc = ev.target.dataset.scope; if (!sc) return; bar.onclick = null;
