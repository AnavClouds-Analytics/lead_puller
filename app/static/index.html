async function renderPulls() {
  setMain(`<h1>Pulls</h1><p class="sub">Every pull you've run. Open one to re-download it or run it again for new people.</p><div class="card" id="pullsTable"></div>`);
  const status = ssGet("lp.pullstatus", "");
  const sel = `<label for="pst" class="hide">Status</label><select id="pst" style="width:auto"><option value="">All statuses</option>${Object.entries(STATUS_BADGE).map(([k,[l]])=>`<option value="${k}" ${k===status?"selected":""}>${l}</option>`).join("")}</select>`;
  let st = status;
  const tbl = pagedTable($("#pullsTable"), "pulls", {placeholder:"Search pull name or request", toolbar: sel, sort:"id", dir:"desc", empty:"No pulls yet.",
    url: s => `/api/pulls?${qs({status: st, ...s})}`,
    cols: [{label:"Pull", sort:"name", html: r=>`<a href="#/pull/${r.id}"><b>${esc(r.name)}</b></a><div class="small muted">#${r.id}${r.cloned_from?` · from #${r.cloned_from}`:""}</div>`},
           {label:"Status", sort:"status", html: r=>{ const [bl,bc] = STATUS_BADGE[r.status]||[r.status,""]; return `<span class="badge ${bc}">${bl}</span>`; }},
           {label:"Account", html: r=>`<span class="small">${esc(r.account_name||"—")}</span>`},
           {label:"People", cls:"right", html: r=>`${fmt(r.kept)}${r.target?` <span class="muted">/ ${fmt(r.target)}</span>`:""}`},
           {label:"With email", cls:"right", html: r=>fmt(r.with_email)},
           {label:"Credits", cls:"right", sort:"credits", html: r=>fmt(r.search_credits + r.research_credits)},
           {label:"Started", sort:"created", html: r=>`<span class="nowrap">${when(r.created_at)}</span>`}]});
  $("#pst").onchange = e => { st = e.target.value; ssSet("lp.pullstatus", st); tbl.state.offset = 0; tbl.reload(); };
}

// ------------------------------------------------------------ presets
async function renderPresets() {
  setMain(`<h1>Presets</h1><p class="sub">Saved searches you reuse. Save one from any pull's filter screen.</p><div class="card" id="presetTable"></div>`);
  const tbl = pagedTable($("#presetTable"), "presets", {placeholder:"Search presets", empty:"No presets yet.",
    url: s => `/api/presets?${qs({offset:s.offset, limit:s.limit, q:s.q})}`,
    cols: [{label:"Preset", html: p=>`<b>${esc(p.name)}</b><div class="small muted">${esc(summarize(p.filters))}</div>`},
           {label:"", cls:"right nowrap", html: p=>`<button class="btn small" data-use="${p.id}">New pull from this</button> <button class="btn small danger" data-delp="${p.id}">Delete</button>`}]});
  $("#presetTable").addEventListener("click", async e => {
    const u = e.target.closest("[data-use]"), d = e.target.closest("[data-delp]");
    if (u) busy(u, async () => { const p = await api(`/api/presets/${u.dataset.use}/use`, {body:{}}); location.hash = "#/pull/" + p.id; });
    if (d) { if (!confirm("Delete this preset?")) return; await api(`/api/presets/${d.dataset.delp}`, {method:"DELETE"}); tbl.reload(); }
  });
}

// ------------------------------------------------------------ exclusions
async function renderExclusions() {
  setMain(`<h1>Do-not-pull list</h1><p class="sub">People and companies this tool never pulls or exports — e.g. your clients, AnavMail suppression list, competitors. Checked before any research credit is spent, on every Seamless account.</p>
    <div class="grid g4" style="margin-bottom:16px" id="exStats"></div>
    <div class="grid g2"><div class="card"><h2>Upload a CSV</h2><p class="small muted">Any CSV with columns like email, domain, linkedin, first_name, last_name, company (an AnavMail leads or suppression export works).</p>
      <input type="file" id="exFile" accept=".csv,text/csv" aria-label="CSV file"><button class="btn primary" id="exUp" style="margin-top:10px">Upload</button></div>
      <div class="card"><h2>Add people by hand</h2><textarea id="exText" rows="4" placeholder="One per line: emails or LinkedIn URLs (a domain here blocks the whole company)" aria-label="People to block"></textarea><button class="btn" id="exAdd" style="margin-top:10px">Add</button></div></div>
    <div class="card"><h2>Blocked companies (every pull)</h2><p class="small muted" style="margin-top:-6px">One per line: a website (<b>accenture.com</b>, which also covers its subdomains) or a company name (<b>Infosys</b> matches “Infosys Ltd”, “Infosys BPM”, but not “Infosysco”). Skipped in every pull before any research credit is spent, and never downloaded. Seamless's search can't exclude companies, so they may still appear in search results (a small search cost, never research).</p>
      <textarea id="coText" rows="4" placeholder="accenture.com&#10;Infosys&#10;Tata Consultancy Services" aria-label="Companies to block"></textarea><button class="btn primary" id="coAdd" style="margin-top:10px">Block these companies</button></div>
    <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">The whole list</h2><button class="btn small danger" id="exClear">Clear entire list</button></div><div id="exTable" style="margin-top:10px"></div></div>`);
  const KIND = {email:"email",domain:"company website",linkedin:"LinkedIn",name_company:"person (name + company)",company_name:"company name"};
  const tbl = pagedTable($("#exTable"), "exclusions", {placeholder:"Search the whole list", empty:"Nothing here.",
    url: s => `/api/exclusions?${qs({offset:s.offset, limit:s.limit, q:s.q})}`,
    onLoad: d => { const c = d.counts; $("#exStats").innerHTML = `<div class="stat"><div class="k">Emails</div><div class="v">${fmt(c.email||0)}</div></div><div class="stat"><div class="k">Domains</div><div class="v">${fmt(c.domain||0)}</div></div>
      <div class="stat"><div class="k">LinkedIn profiles</div><div class="v">${fmt(c.linkedin||0)}</div></div><div class="stat"><div class="k">Blocked company names</div><div class="v">${fmt(c.company_name||0)}</div><div class="h">${fmt(c.name_company||0)} name + company people</div></div>`; },
    cols: [{label:"Value", html: r=>esc(r.kind==="name_company"?r.value.slice(3).replace("|"," @ "):r.value)}, {label:"Type", html: r=>esc(KIND[r.kind]||r.kind)},
           {label:"From", html: r=>`<span class="small muted">${esc(r.source)}</span>`}, {label:"", cls:"right", html: r=>`<button class="btn small" data-delx="${esc(r.key)}">Remove</button>`}]});
  $("#exUp").onclick = e => busy(e.currentTarget, async () => { const f = $("#exFile").files[0]; if (!f) return toast("Choose a CSV file.", true);
    const fd = new FormData(); fd.append("file", f); const r = await api("/api/exclusions/upload", {body:fd}); toast(`Added ${fmt(r.added)} entries.`); tbl.reload(); });
  $("#coAdd").onclick = e => busy(e.currentTarget, async () => { const r = await api("/api/exclusions", {body:{companies:$("#coText").value}}); toast(`Blocked ${fmt(r.added)} companies.`); $("#coText").value = ""; tbl.reload(); });
  $("#exAdd").onclick = e => busy(e.currentTarget, async () => { const r = await api("/api/exclusions", {body:{text:$("#exText").value}}); toast(`Added ${fmt(r.added)} entries.`); $("#exText").value = ""; tbl.reload(); });
  $("#exClear").onclick = async () => { if (!confirm("Remove everything from the do-not-pull list?")) return; await api("/api/exclusions", {method:"DELETE"}); tbl.reload(); };
  $("#exTable").addEventListener("click", async e => { const b = e.target.closest("[data-delx]"); if (!b) return;
    await api(`/api/exclusions?key=${encodeURIComponent(b.dataset.delx)}`, {method:"DELETE"}); tbl.reload(); });
}

// ------------------------------------------------------------ Seamless accounts
async function renderAccounts() {
  const d = await api("/api/accounts");
  refreshChrome(d.credits);
  const rows = d.rows;
  setMain(`<h1>Seamless accounts</h1><p class="sub">Add the API key of each Seamless user. New pulls use the first switched-on account (in this order) that has credits to spare; when it runs low, the pull pauses and offers to continue on the next one.
      People and companies are remembered across all accounts, so nobody found with one key is shown or paid for again with another.</p>
    ${(d.shared_pools||[]).map(g=>`<div class="notice warn"><b>${esc(g.names.join(" and "))} show exactly the same balance (${fmt(g.balance)}).</b> They're probably one shared credit pool (Seamless's docs say credits belong to the whole organization), so the tool counts it once. Ask Seamless whether your users have separate credits.</div>`).join("")}
    <div class="card"><div class="tablewrap"><table><thead><tr><th>Order</th><th>Account</th><th>Key</th><th class="right">Balance</th><th class="right">Spent this month</th><th>Monthly budget</th><th class="right">Can still spend</th><th>On</th><th></th></tr></thead><tbody>
    ${rows.map((a,i)=>`<tr data-aid="${a.id}">
      <td class="nowrap"><button class="btn small" data-up ${i===0?"disabled":""} aria-label="Move up">↑</button> <button class="btn small" data-down ${i===rows.length-1?"disabled":""} aria-label="Move down">↓</button></td>
      <td><input value="${esc(a.name)}" data-name style="min-width:120px;max-width:180px" aria-label="Account name">${a.source==="env"?'<div class="small muted">from .env (SEAMLESS_API_KEY)</div>':""}${a.last_error?`<div class="small" style="color:var(--bad)">${esc(a.last_error)}</div>`:""}</td>
      <td class="nowrap"><code>${esc(a.key)}</code></td>
      <td class="right">${fmt(a.balance)}<div class="small muted">${a.balance_at?when(a.balance_at):"not checked"}</div>${a.low?'<span class="badge b-bad">low</span>':""}</td>
      <td class="right">${fmt(a.spent_this_month)}</td>
      <td><input type="number" min="0" value="${a.monthly_budget||""}" placeholder="No limit" data-budget style="width:100px" aria-label="Monthly budget for ${esc(a.name)}"></td>
      <td class="right"><b>${a.usable==null?"—":fmt(a.usable)}</b></td>
      <td><input type="checkbox" data-on ${a.enabled?"checked":""} style="width:auto" aria-label="Switch ${esc(a.name)} on or off"></td>
      <td class="right"><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><button class="btn small" data-test>Check balance (free)</button>${a.source==="env"?"":`<div class="nowrap"><button class="btn small" data-rekey>New key</button> <button class="btn small danger" data-delacct>Delete</button></div>`}</div></td></tr>
      ${a.check ? `<tr><td></td><td colspan="8" class="small ${a.check.warn?"":"muted"}" style="${a.check.warn?"color:var(--warn)":""}">This month: started at ${fmt(a.check.start_balance)}${a.check.added?`, ${fmt(a.check.added)} added`:""}, now ${fmt(a.check.balance)}. ${esc(a.check.message)}</td></tr>` : ""}`).join("") || '<tr><td colspan="9" class="muted">No accounts yet. Add your first Seamless API key below.</td></tr>'}
    </tbody></table></div>
    <div class="small muted" style="margin-top:8px">“Can still spend” = balance minus the reserve of ${fmt(d.reserve)} (ACCOUNT_RESERVE in .env), and no more than this account's monthly budget or what's left of the overall MONTHLY_CREDIT_BUDGET. Keys are stored on your server and only the last 4 characters are ever shown.</div></div>
    <div class="card"><h2>Add a Seamless account</h2><div class="grid g3">
      <div class="field"><label for="naName">Name</label><input id="naName" placeholder="e.g. Gaurav's Seamless"></div>
      <div class="field"><label for="naKey">API key</label><input id="naKey" type="password" autocomplete="off" placeholder="Seamless → Settings → Public API → API Key"></div>
      <div class="field"><label for="naBudget">Monthly budget (optional)</label><input id="naBudget" type="number" min="0" placeholder="No own limit"></div></div>
      <button class="btn primary" id="naAdd">Check key and add</button><span class="small muted" style="margin-left:8px">The key is checked with a free call first.</span></div>`);
  const rowOf = el => el.closest("tr[data-aid]");
  const aid = el => +rowOf(el).dataset.aid;
  const patch = async (el, body, msg) => { try { const r = await api(`/api/accounts/${aid(el)}`, {method:"PATCH", body}); refreshChrome(r.credits); toast(msg); renderAccounts(); } catch(e) { toast(e.message, true); renderAccounts(); } };
  $("#main").addEventListener("change", e => {
    if (e.target.matches("[data-name]")) patch(e.target, {name: e.target.value}, "Renamed.");
    if (e.target.matches("[data-budget]")) patch(e.target, {monthly_budget: +e.target.value || 0}, "Budget saved.");
    if (e.target.matches("[data-on]")) patch(e.target, {enabled: e.target.checked}, e.target.checked ? "Switched on." : "Switched off: new pulls won't use it.");
  });
  $("#main").addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b || !rowOf(b)) return;
    const ids = rows.map(a => a.id), i = ids.indexOf(aid(b));
    if (b.matches("[data-up]") || b.matches("[data-down]")) { const j = b.matches("[data-up]") ? i-1 : i+1; [ids[i], ids[j]] = [ids[j], ids[i]];
      await api("/api/accounts/order", {body:{ids}}); return renderAccounts(); }
    if (b.matches("[data-test]")) return busy(b, async () => { await api(`/api/accounts/${aid(b)}/test`, {body:{}}); toast("Balance checked."); await refreshMeta(); renderAccounts(); });
    if (b.matches("[data-rekey]")) { const k = prompt("Paste the new API key for this account:"); if (!k) return; return patch(b, {api_key: k.trim()}, "Key replaced."); }
    if (b.matches("[data-delacct]")) { if (!confirm("Delete this account? Its spending history stays. People and companies found with it stay remembered.")) return;
      try { await api(`/api/accounts/${aid(b)}`, {method:"DELETE"}); toast("Deleted."); renderAccounts(); } catch(err) { toast(err.message, true); } }
  });
  $("#naAdd").onclick = e => busy(e.currentTarget, async () => {
    const key = $("#naKey").value.trim(); if (!key) return toast("Paste the API key.", true);
    await api("/api/accounts", {body:{name:$("#naName").value.trim(), api_key:key, monthly_budget:+$("#naBudget").value||0}});
    toast("Account added."); await refreshMeta(); renderAccounts();
  });
}

    const r = e.target.closest("[data-rel]"), b = e.target.closest("[data-blk]");
    if (r) busy(r, async () => { await api("/api/companies/release", {body:{key:r.dataset.rel}}); toast("Allowed again."); tbl.reload(); });
    if (b) { if (!confirm("Never pull anyone from this company again? (Adds it to your blocked companies.)")) return;
      await api("/api/companies/block", {body:{key:b.dataset.blk}}); tbl.reload(); }
  });
}

route().catch(e => toast(e.message, true));
</script>
</body>
</html>
